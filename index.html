const RULES='<div style="font-size:14px;line-height:1.9"><p style="margin:0 0 8px"><b>Pearla 的隨機系統遵守以下規則：</b></p><p>① 每次字卡抽取都獨立進行。</p><p>② 所有符合條件的字卡，被抽中的機會完全相同。</p><p>③ 不排除重複結果，同一張字卡可以連續被抽到。</p><p>④ 不因連續抽到相同結果而調整機率。</p><p>⑤ 不設置保底或補償機制。</p><p>⑥ 不刻意平均分配結果。</p><p>⑦ 每一種互動的機率各自獨立判定。</p><p>⑧ 每項設定的數值只影響它所對應的那項互動。</p><p>⑨ 不根據你輸入的文字做語意分析。</p><p>⑩ 不根據之前的互動結果改變後續機率。</p><p>⑪ 被動回覆在發送訊息後先等 6 秒，6 秒過後才開始判定是否已讀不回；主動發送則先到達主動發送判定點，再判定發送取消概率，未取消才隨機計算下一個發送時間。</p><p>⑫ 等待回覆期間不會預先選字卡，等待時間結束後才抽取並立即傳送；一旦抽出就一定會傳送，不會再做第二次「要不要傳」的判定。</p><p>⑬ 同一次回覆有多條時，所有字卡在同一時間抽好，但每隔 3 秒（暫定）才發送下一條。</p><p>⑭ 每條字卡的情緒、心意等判定各算各的，不受同一輪其他字卡影響。</p><p>⑮ emoji和顏文字的抽取判定是：每次回覆、主動發送都會依照設定機率，隨機抽取是否添加emoji與顏文字；抽中則會隨機出現在當次回覆的開頭或結尾，開頭與結尾的概率各一半。</p><p>⑯ 各類提醒、他的問題、他的吐槽都是額外發送的訊息，不佔用主動發送的字卡概率與次數。</p><p>⑰ 每日留言會在每日 0 點開始抽取；若抽取失敗，會在設定的抽取時間結束後再次抽取。若當時未開啟網頁，則於開啟網頁後立刻開始抽取；同一天重複開啟網頁不會重置或重新判定，必須等到已儲存的抽取時間結束。每天 0 點會重新建立當天的抽取時間段，不沿用前一天的時間段；抽取成功後，當天不再繼續抽取。</p><p>⑱ 狀態會在程式開啟後開始計時，每到設定的抽取時間才判定一次是否更改狀態；重複開啟程式不會重置計時，必須等到設定時間結束後才會再次判定。若判定成功，會從狀態字卡中隨機抽取並顯示在聊天室名稱下方。</p><p>⑲ 所有計時以目前選定的聊天對象為單位，每個對象各自保存下一次狀態判定時間。</p><p>⑳ 引用消息：每一輪回覆都會依照設定的概率判定一次是否引用消息。判定成功時，會從你發出的最後 10 條訊息中隨機挑選一條來引用；無論判定成功與否，每一輪回覆都只會進行這一次引用判定。</p><p>㉑ 表情包：每一輪回覆都會依照設定的概率判定一次是否發送表情包；判定成功時，會從可抽取的表情包中隨機抽取一個，隨機插在本輪任一則回覆的前面或後面，所有可插入位置的機率完全相同（例如只有一則回覆時，插在它前面或後面的機率各一半）。</p></div>';
const NOVA='<div style="font-size:14px;line-height:1.9"><p style="margin:0 0 10px"><b>Nova 式回覆</b>是「連著說的話併成一輪再回」的回覆方式，讓對方看起來像真的在讀你的話、想一想再回。</p><p>① 一輪只排一次隊：你連著發的幾句話併成同一輪，每位聯絡人各自只排一次隊。</p><p>② 骰子只擲一次：已讀不回、拍一拍、回幾條，在這一輪開始時擲定，之後補的句子不會重擲；引用消息同樣每一輪只判定一次。</p><p>③ 到點時間：發送後先等 6 秒，沒有已讀不回，才從「回覆最短時間」到「回覆最長時間」之間隨機抽一個等待時間。</p><p>④ 補一句往後推：你每多補一句，到點時間往後推 1.5 秒，一輪最多替你多等 8 秒。</p><p>⑤ 各排各的：每位聯絡人各有自己的一輪，切去別的聯絡人發訊息，不會頂掉原本那一輪的計時。</p><p>⑥ 已讀不回：發送 6 秒後才開始判定；若擲到，小字當下就出現、這一輪不再回覆；沒擲到才開始抽等待時間與字卡。</p><p>⑦ 回覆內容：每一條都從字卡抽取，並依 emoji、顏文字的概率決定要不要添加；表情包則是每一輪判定一次，成功就額外發送一個，並隨機插在任一則回覆的前面或後面；每次抽取獨立、機會均等。</p></div>';

document.addEventListener('pointerdown',e=>{const a=cpk&&e.target.closest('#cpsv,#cph');if(!a)return;cpk.drag=a.id;try{a.setPointerCapture(e.pointerId)}catch(x){}e.preventDefault();cpMove(e)});
document.addEventListener('pointermove',e=>{if(cpk&&cpk.drag)cpMove(e)});
document.addEventListener('pointerup',()=>{if(cpk)cpk.drag=null});
/* ── 輸入框：點擊全選，留空則還原 ── */
const isTxt=el=>el&&el.tagName==='INPUT'&&!['date','color','range','file','checkbox','radio','button','submit'].includes(el.type);
document.addEventListener('focusin',e=>{const el=e.target;if(isTxt(el)){el.dataset.orig=el.value;if(el.id!=='newContactName'&&!((tab==='chat'||tab==='contacts')&&el.type!=='number'))setTimeout(()=>{if(document.activeElement===el){try{el.select()}catch(x){}}},0)}
  else if(el&&el.isContentEditable&&!(el.dataset&&el.dataset.a==='ren')){setTimeout(()=>{if(document.activeElement===el){const r=document.createRange();r.selectNodeContents(el);const g=getSelection();g.removeAllRanges();g.addRange(r)}},0)}});
const restoreEmpty=e=>{const el=e.target;if(isTxt(el)&&(el.type==='number'||el.id==='ai'||el.id==='today-mood-text')&&el.value.trim()===''&&el.dataset.orig){el.value=el.dataset.orig;el.dispatchEvent(new Event('input',{bubbles:true}))}};
document.addEventListener('change',restoreEmpty,true);document.addEventListener('focusout',restoreEmpty,true);

document.addEventListener('click',e=>{if(tab!=='chat')return;if(e.target.closest('.mact')){setTimeout(()=>{const o=$('#cl .mact');if(o)o.remove()},0);return}
  const bub=e.target.closest('#cl .m .b'),old=$('#cl .mact');let same=false;if(old){same=!!bub&&old.parentNode===bub;old.remove()}
  if(!bub||same||bub.classList.contains('qa-b'))return;
  const id=bub.closest('.m').id.slice(2),m=ms(S.cur).find(x=>x.id===id);if(!m)return;
  const b=(a,t)=>'<button type="button" data-a="'+a+'" data-i="'+id+'">'+t+'</button>';
  bub.insertAdjacentHTML('afterbegin','<div class="mact">'+b('qt','引用')+(m.f==='me'?(m.img?'':b('medt','編輯'))+b('mdelm','刪除'):'')+'</div>')});
/* ── 啟動 ── */
(async()=>{
  await idb();
  const o=await load();
  S=mig(o&&Array.isArray(o.contacts)&&o.contacts.length?Object.assign(def(),o,{tags:o.tags}):def());
  $('#fi').addEventListener('change',e=>{const fs=[...e.target.files];e.target.value='';if(fs.length&&fiCb)fiMul?fiCb(fs):fiCb(fs[0])});
  Object.keys(S.next).forEach(k=>{if(S.next[k]<Date.now())S.next[k]=0});
  applyTheme();
  document.addEventListener('focusout',e=>{const n=e.target.dataset&&e.target.dataset.n;if(!n)return;const v=e.target.textContent.trim();let t;if(n==='m'){S.me=v||'我';t=S.me}else{const c=n==='c'?cur():S.contacts.find(x=>x.id===e.target.closest('[data-c]').dataset.c);c.name=v||'名字';t=c.name}e.target.textContent=t;save()});
  document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.n){e.preventDefault();e.target.blur()}});
  document.addEventListener('change',e=>{const k=e.target.dataset.n2;if(k){e.target.value=S.set[k];if(activeSetting(k))resetA();else save()}});
  document.addEventListener('input',e=>{if(e.target.dataset.n2){const k=e.target.dataset.n2,v=parseFloat(e.target.value);if(!isNaN(v)){S.set[k]=e.target.dataset.u==='%'?Math.min(100,Math.max(0,v)):Math.max(0,v);if(activeSetting(k))resetA();else saveSoon()}}if(e.target.id==='memoin'){S.memo=e.target.value;saveSoon();const mt=$('.memo-txt');if(mt)mt.innerHTML=memoSlots()}if(e.target.id==='cphex'&&cpk){const rgb=hex2rgb(e.target.value);if(rgb){[cpk.h,cpk.s,cpk.v]=rgb2hsv(rgb);cpUI(true)}}if(e.target.dataset.md){mailDraft[e.target.dataset.md]=e.target.value}if(e.target.dataset.qd!=null){qd[e.target.dataset.qd]=e.target.value}if(e.target.dataset.qs){const [qa_,qb_]=e.target.dataset.qs.split('.'),qv=parseFloat(e.target.value);if(!isNaN(qv)&&S.qa[qa_]){S.qa[qa_][qb_]=Math.max(0,qv);saveSoon()}}if(e.target.id==='rq'){rQ=e.target.value;const rb=$('#rbody');if(rb)rb.innerHTML=rCard(rQ)}if(e.target.id==='sq'){sQ=e.target.value;$('#sl').innerHTML=sList()}if(e.target.id==='tc'){S.ink=e.target.value;applyTheme();saveSoon()}if(e.target.id==='markColor'){S.set.starColor=e.target.value;saveSoon();paint()}if(e.target.id==='lc'){S.line=e.target.value;document.documentElement.style.setProperty('--line',S.line);saveSoon()}if(e.target.id==='bgc'){S.bgColors=S.bgColors||{};S.bgColors[e.target.dataset.i]=e.target.value;saveSoon();render()}});
  document.addEventListener('scroll',e=>{const t=e.target;if(t.classList&&t.classList.contains('pager')){const n=Math.round(t.scrollLeft/t.clientWidth);document.querySelectorAll('.dots i').forEach((d,k)=>d.classList.toggle('on',k===n))}},true);
  document.addEventListener('focusin',e=>{if(e.target.id==='bt')$('#bph').style.display='none'});
  document.addEventListener('focusout',e=>{if(e.target.id==='bt'&&!e.target.value)$('#bph').style.display=''});
  document.addEventListener('input',e=>{const t=e.target;
    if(t.id==='cq'){cq=t.value;const r=$('#cres'),m=$('#cmain'),on=cq.trim();r.innerHTML=on?cres():'';r.style.display=on?'':'none';m.style.display=on?'none':''}
    if(t.dataset&&t.dataset.t3){const k=t.dataset.t3,v=[...t.closest('.sr').querySelectorAll('[data-t3]')].map(x=>Math.max(0,parseInt(x.value)||0));S.set[k]=v[0]*3600+v[1]*60+v[2];saveSoon()}});
  document.addEventListener('change',e=>{const t=e.target;if(t.dataset&&t.dataset.t3){const k=t.dataset.t3,T=Math.round(S.set[k]||0),a=[Math.floor(T/3600),Math.floor(T%3600/60),T%60];t.closest('.sr').querySelectorAll('[data-t3]').forEach((x,i)=>x.value=a[i]);save()}});
  ['gesturestart','gesturechange'].forEach(g=>document.addEventListener(g,e=>e.preventDefault()));
  document.addEventListener('touchmove',e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});
  S.pend=S.pend||[];
  statusTick();
  dailyTick();
  save();render();
})();
</script>
