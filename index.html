[data-theme=glass][data-skin=journal] .gdm{background:#c6d8ef;border:none;border-radius:6px;box-shadow:0 3px 8px #5b7aa62b;color:var(--ink)}
[data-theme=glass][data-skin=journal] .gdm svg{stroke:#4f6d99}
/* 月曆（參考手帳圖：頂部小圓點、小標、草寫月份、年/月、週標底線、前後月淡色日期、底部日期與草寫句） */
.gcal-dots,.gcal-cap,.gcal-ym,.gcal-ft{display:none}
.gcal-g .o{visibility:hidden}
[data-theme=glass][data-skin=journal] .gcard.gcal{border-radius:6px;background:#fbfdff;border:1px solid #d3e0f0;border-right-color:#c3d4ea;border-bottom:2px solid #c3d4ea;padding:13cqw 7cqw 6cqw}
[data-theme=glass][data-skin=journal] .gcal::before{left:36%}
[data-theme=glass][data-skin=journal] .gcal .ring{display:none}
[data-theme=glass][data-skin=journal] .gcal-dots{display:block;position:absolute;top:5cqw;left:6cqw;right:6cqw;height:1.6cqw;background:radial-gradient(circle,#b3c6e0 0 .55cqw,transparent .65cqw) 0 0/6.9cqw 100% repeat-x}
[data-theme=glass][data-skin=journal] .gcal-cap{display:block;text-align:center;font-family:Georgia,"Times New Roman",serif;font-size:3cqw;letter-spacing:.3em;color:#9fb0cc}
[data-theme=glass][data-skin=journal] .gcal-h{font-size:12cqw;line-height:1.15;color:var(--ink);margin-top:.5cqw}
[data-theme=glass][data-skin=journal] .gcal-h small{display:none}
[data-theme=glass][data-skin=journal] .gcal-ym{display:block;text-align:center;font-family:Georgia,"Times New Roman",serif;font-size:3.4cqw;letter-spacing:.2em;color:#8fa2c2}
[data-theme=glass][data-skin=journal] .gcal-w{margin:4cqw 0 1.5cqw;padding-bottom:2.2cqw;border-bottom:1px solid #d3e0f0;color:#9fb0cc}
[data-theme=glass][data-skin=journal] .gcal-g .o{visibility:visible;color:#b4c3dc}
[data-theme=glass][data-skin=journal] .gcal-g .today{border-radius:50%;width:9cqw;height:9cqw;background:#dbe7f6;box-shadow:0 0 0 1px #7fa1cc inset}
[data-theme=glass][data-skin=journal] .gcal-ft{display:block;margin-top:2.5cqw;padding-top:2.5cqw;border-top:1px solid #d3e0f0;text-align:center}
[data-theme=glass][data-skin=journal] .gcal-ft span{display:block;text-align:left;font-size:3.3cqw;color:#8fa2c2;letter-spacing:.04em}
[data-theme=glass][data-skin=journal] .gcal-ft em{display:block;margin-top:1.5cqw;font-family:"Snell Roundhand","Apple Chancery","Segoe Script","Brush Script MT",cursive;font-style:normal;font-size:5.4cqw;color:#6f8bb5}
</style>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const rnd=()=>crypto.getRandomValues(new Uint32Array(1))[0]/4294967296;
const ri=n=>Math.floor(rnd()*n);
const tm=t=>{const d=new Date(t);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const ini=n=>String(n||'').trim().slice(0,1)||'TA';
const WAITS=[3,10,30,60,300,900,1800,3600,7200];
const WL=s=>s<60?s+' 秒':s<3600?s/60+' 分鐘':s/3600+' 小時';
let S,db,tab='home',scope='s',kind='card',selCat=null,askCb=null,jump=null,emoScope='s',lastRenderedTab='';

/* ── IndexedDB ── */
const idb=()=>new Promise(r=>{try{const q=indexedDB.open('pearla',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>{db=q.result;r()};q.onerror=()=>r()}catch(e){r()}});
const load=()=>new Promise(r=>{if(!db)return r(null);try{const q=db.transaction('kv').objectStore('kv').get('s');q.onsuccess=()=>r(q.result||null);q.onerror=()=>r(null)}catch(e){r(null)}});
const save=()=>{try{db&&db.transaction('kv','readwrite').objectStore('kv').put(JSON.parse(JSON.stringify(S)),'s')}catch(e){}};

function def(){
  const a=uid(),b=uid(),c1=uid(),c2=uid(),c3=uid();
  return{me:'我',cur:a,contacts:[{id:a,name:'名字'}],msgs:{},kitchen:{attempts:0,products:[],unlocked:[]},
    cats:[],
    cards:[],
    set:{keepBg:0,wi:2,star:10,dailyMoodOn:1,starColor:'#5f5b8d',mood:15,heart:15,intent:15,pat:50,emoji:50,dailyOn:0,dailyProb:70,dailyWindow:21600,dailyMin:1,dailyMax:5,dailyKao:20,dailyEmoji:20,statusOn:0,statusWindow:7200,statusProb:70},
    pend:[],dailies:{},todayMoodBy:{},locked:true};
}
const cur=()=>S.contacts.find(c=>c.id===S.cur)||S.contacts[0];
const CMD={on:0,prob:50,wall:1,tmin:1200,tmax:10800};
const cmo=c=>(c.ms=Object.assign({},CMD,c.ms||{}));
const sget=k=>k.startsWith('cm.')?cmo(cur())[k.slice(3)]:S.set[k];
const sput=(k,v)=>{if(k.startsWith('cm.')){cmo(cur())[k.slice(3)]=v;if(k==='cm.tmin'||k==='cm.tmax')delete S.mst[cur().id]}else S.set[k]=v};
const ms=id=>S.msgs[id]||(S.msgs[id]=[]);
const kc=c=>c.kind||'card';
const INS=k=>k==='mem'||k==='ext';
const tabOn=k=>k===kind||(k==='insp'&&INS(kind));
const CTABS=[['card','字卡'],['insp','靈感拾取'],['emoji','表情包'],['pat','拍一拍'],['kao','顏文字'],['other','其他']];
const KINDS=[['card','字卡'],['mood','情緒'],['heart','心意'],['intent','交流意圖'],['emoji','表情包'],['pat','拍一拍']];

const RULES='<div style="font-size:14px;line-height:1.9"><p style="margin:0 0 8px"><b>Pearla 的隨機系統遵守以下規則：</b></p><p>① 每次字卡抽取都獨立進行。</p><p>② 所有符合條件的字卡，被抽中的機會完全相同。</p><p>③ 不排除重複結果，同一張字卡可以連續被抽到。</p><p>④ 不因連續抽到相同結果而調整機率。</p><p>⑤ 不設置保底或補償機制。</p><p>⑥ 不刻意平均分配結果。</p><p>⑦ 每一種互動的機率各自獨立判定。</p><p>⑧ 每項設定的數值只影響它所對應的那項互動。</p><p>⑨ 不根據你輸入的文字做語意分析。</p><p>⑩ 不根據之前的互動結果改變後續機率。</p><p>⑪ 被動回覆在發送訊息後先等 6 秒，6 秒過後才開始判定是否已讀不回；主動發送則先到達主動發送判定點，再判定發送取消機率，未取消才隨機計算下一個發送時間。</p><p>⑫ 等待回覆期間不會預先選字卡，等待時間結束後才抽取並立即傳送；一旦抽出就一定會傳送，不會再做第二次「要不要傳」的判定。</p><p>⑬ 同一次回覆有多條時，所有字卡在同一時間抽好，但每隔 3 秒（暫定）才發送下一條。</p><p>⑭ 每條字卡的情緒、心意等判定各算各的，不受同一輪其他字卡影響。</p><p>⑮ emoji與顏文字：每選擇一條字卡後，會先等待設置的「選擇emoji時間」或「選擇顏文字時間」，時間結束才依各自的機率判定要不要加入。兩者的等待時間分開計算，先等emoji或先等顏文字完全隨機；抽中的emoji或顏文字會隨機出現在該條字卡的開頭或結尾，機率各一半。聊天室被動回覆、主動發送與聯絡人發布朋友圈都依照此規則。</p><p>⑯ 各類提醒、他的問題、他的吐槽都是額外發送的訊息，不佔用主動發送的字卡機率與次數。</p><p>⑰ 每日留言會在每日 0 點開始抽取；若抽取失敗，會在設定的抽取時間結束後再次抽取。若當時未開啟網頁，則於開啟網頁後立刻開始抽取；同一天重複開啟網頁不會重置或重新判定，必須等到已儲存的抽取時間結束。每天 0 點會重新建立當天的抽取時間段，不沿用前一天的時間段；抽取成功後，當天不再繼續抽取。</p><p>⑱ 狀態會在程式開啟後開始計時，每到設定的抽取時間才判定一次是否更改狀態；重複開啟程式不會重置計時，必須等到設定時間結束後才會再次判定。若判定成功，會從狀態字卡中隨機抽取並顯示在聊天室名稱下方。</p><p>⑲ 所有計時以目前選定的聊天對象為單位，每個對象各自保存下一次狀態判定時間。</p><p>⑳ 引用消息：每一輪回覆都會依照設定的機率判定一次是否引用消息。判定成功時，會從你發出的最後 10 條訊息中隨機挑選一條來引用；無論判定成功與否，每一輪回覆都只會進行這一次引用判定。</p><p>㉑ 表情包：每一輪回覆都會依照設定的機率判定一次是否發送表情包；判定成功時，會從可抽取的表情包中隨機抽取一個，隨機插在本輪任一則回覆的前面或後面，所有可插入位置的機率完全相同（例如只有一則回覆時，插在它前面或後面的機率各一半）。</p><p>㉒ 聯絡人發布朋友圈：聯絡人會在「發布朋友圈時間」的最短與最長範圍內隨機選一個時間，時間到了才判定要不要發文。判定成功後，先依「選擇字卡時間」隨機等待一段時間，結束才開始抽取字卡；字卡抽取完畢，才依「選擇表情包時間」隨機等待，結束後依機率判定是否抽取表情包，判定成功才開始隨機抽取；表情包抽取完畢，再依「選擇貼紙時間」隨機等待，結束後依機率判定是否抽取貼紙，判定成功才開始隨機抽取，並在「放置貼紙時間」結束後，把貼紙放到貼圖牆上的隨機位置。全部選擇完成後才會一起發布到朋友圈。</p><p>㉓ 字卡、表情包、貼紙的數量不會事先決定，而是各自開始抽取時才決定，抽完才知道各有幾個。若聯絡人沒有任何表情包與貼紙可用，就不會發布貼圖牆。</p><p>㉔ 貼圖回覆：你在貼圖牆上貼了貼紙後，聯絡人會先等「判定是否回覆貼紙時間」，時間到再依機率判定要不要回覆；判定成功後，會在「選擇貼紙時間」的範圍內隨機等待一段時間才抽取貼紙；抽取完畢再等「放置貼紙時間」，貼紙會依序（每貼完一個隔 1 秒再貼下一個）出現在貼圖牆上的任意位置，也可能蓋在表情包或你的貼紙上。貼在聯絡人的貼文上，由該聯絡人回覆；貼在自己空間的貼圖牆上，由目前選定的聊天對象回覆。</p></div>';
const NOVA='<div style="font-size:14px;line-height:1.9"><p style="margin:0 0 10px"><b>Nova 式回覆</b>是「連著說的話併成一輪再回」的回覆方式，讓對方看起來像真的在讀你的話、想一想再回。</p><p>① 一輪只排一次隊：你連著發的幾句話併成同一輪，每位聯絡人各自只排一次隊。</p><p>② 骰子只擲一次：已讀不回、拍一拍、回幾條，在這一輪開始時擲定，之後補的句子不會重擲；引用消息同樣每一輪只判定一次。</p><p>③ 到點時間：發送後先等 6 秒，沒有已讀不回，才從「回覆最短時間」到「回覆最長時間」之間隨機抽一個等待時間。</p><p>④ 補一句往後推：你每多補一句，到點時間往後推 1.5 秒，一輪最多替你多等 8 秒。</p><p>⑤ 各排各的：每位聯絡人各有自己的一輪，切去別的聯絡人發訊息，不會頂掉原本那一輪的計時。</p><p>⑥ 已讀不回：發送 6 秒後才開始判定；若擲到，小字當下就出現、這一輪不再回覆；沒擲到才開始抽等待時間與字卡。</p><p>⑦ 回覆內容：每一條都從字卡抽取，並在每條字卡抽取後，各自等待選擇時間再依 emoji、顏文字的機率決定要不要添加；表情包則是每一輪判定一次，成功就額外發送一個，並隨機插在任一則回覆的前面或後面；每次抽取獨立、機會均等。</p></div>';
function rulesHtml(q){q=(q||'').trim();if(!q)return RULES;const ps=RULES.match(/<p[^>]*>[\s\S]*?<\/p>/g)||[],ql=q.toLowerCase(),re=new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),hit=ps.filter(x=>x.replace(/<[^>]+>/g,'').toLowerCase().includes(ql));if(!hit.length)return '<div class="empty">沒有符合的內容。</div>';return '<div style="font-size:14px;line-height:1.9">'+hit.map(x=>x.replace(/(<[^>]+>)|([^<]+)/g,(m,t,y)=>t||y.replace(re,'<mark>$&</mark>'))).join('')+'</div>'}
const rCard=q=>'<div class="card set">'+rulesHtml(q)+'</div>';

const INSPRULE=IR('靈感拾取說明',`<p style="margin:0 0 8px">靈感拾取是一項從日常聊天中收集文字的功能。Pearla 會在使用者與聯絡人的互動過程中，隨機拾取曾經說過的詞語、片語或句子，將它們保存成獨立的字卡。</p><p style="margin:0 0 8px">每一次拾取都是獨立的隨機事件。Pearla 不會替使用者改寫文字，也不會自行創作新的內容，而是保留原本說過的話，讓它們有機會再次出現在往後的對話中。</p><p style="margin:0 0 4px"><b>靈感拾取擁有以下性質：</b></p><ol style="margin:0 0 8px;padding-left:20px"><li>獨立性：記憶字卡與提取字卡有各自獨立的觸發流程。</li><li>隨機性：每次提取都獨立判定，不依照歷史結果調整機率。</li><li>原文性：只使用使用者實際說過的文字，不自行生成內容。</li><li>專屬性：每位聯絡人的聊天內容及字卡資料互不混用。</li><li>可追溯性：主頁-靈感拾取裡會記錄每張字卡的來源訊息。</li><li>自主性：使用者可以管理字卡、編輯文字及決定是否加入抽卡範圍。</li><li>非強制性：提取字卡可以只發送、不保存，讓偶然出現的文字不一定都成為永久收藏。</li><li>不重複性：不會保存重複的字卡。</li></ol><p style="margin:0 0 8px"><b>記憶字卡</b>功能可以從使用者主動發送的訊息中拾取文字：每當使用者發送一則符合條件的文字訊息，Pearla 就會依照設定的機率，獨立判定是否進行提取。若判定成功，Pearla 會從該則訊息中隨機擷取適合的文字，建立一張記憶字卡。</p><p style="margin:0 0 8px"><b>提取字卡</b>功能在 Pearla 回覆字卡後，額外拾取使用者過去說過的文字：聯絡人每次回覆，就會啟動一次獨立的提取判定流程。判定成功後，Pearla 會從目前聯絡人的歷史聊天訊息中，隨機提取一段使用者曾經說過的文字，並在等待時間結束後，額外發送一則帶有「提取字卡」標籤的訊息。這張字卡不一定會被永久保存，發送後還會進行一次獨立的保存機率判定。因此，有些文字會成為提取字卡儲存，有些則只會在當下短暫出現。</p><p style="margin:0 0 4px"><b>記憶與提取內容：</b></p><ol style="margin:0 0 8px;padding-left:20px"><li>單字：具有獨立意義的完整詞語。</li><li>連續詞組：原始訊息中連續出現的詞語組合。</li><li>完整句子：原始訊息中的完整句子。</li><li>排除沒有獨立意義的助詞及代詞。</li><li>如果無法可靠辨識詞語，則改為提取完整句子。</li></ol><p style="margin:0 0 8px">中文分詞由瀏覽器內建的分詞（Intl.Segmenter）負責，Pearla 自行控制隨機抽取及提取機率。兩者是獨立模組。</p><p style="margin:0">保存後的記憶字卡與提取字卡將加入抽卡範圍，與一般字卡一起被抽取，完全隨機、不保底（可看作為一般字卡中的兩個特殊分類）。</p>`)
+IR('靈感拾取之記憶字卡流程與規則',`<p style="margin:0 0 4px"><b>記憶字卡流程：</b></p><ol style="margin:0 0 8px;padding-left:20px"><li>Pearla 獨立判定本次使用者發送的訊息是否觸發提取。</li><li>若判定失敗，本次流程結束。</li><li>若判定成功，瀏覽器內建的分詞（Intl.Segmenter）辨識訊息中的詞語。</li><li>Pearla 從原始訊息的位置擷取文字並驗證。成功擷取後，建立或更新記憶字卡。</li></ol><p style="margin:0 0 4px"><b>記憶字卡規則：</b></p><ol style="margin:0;padding-left:20px"><li>當每條訊息記憶判定成功後，依照設置隨機時間開始抽取要新增哪些詞語。</li><li>每個詞語新增至記憶字卡的機率依照設置，每個詞語互不影響、完全隨機。</li><li>記憶字卡會永久保存於對應聯絡人的字卡分類中，除非使用者自行刪除。</li></ol>`)
+IR('靈感拾取之拾取字卡流程與規則',`<p style="margin:0 0 8px">每次 Pearla 完成一則字卡回覆後，都會啟動一個獨立流程。</p><ul style="margin:0 0 8px;padding-left:20px"><li><b>第一階段：等待提取判定。</b>每一次聯絡人字卡回覆會從設定的最短與最長等待時間之間，隨機選取一個等待時間。等待時間結束後，才依設置機率進行提取觸發機率判定。若判定失敗，本次流程結束，不會發送提取字卡。</li><li><b>第二階段：等待實際提取。</b>若第一階段判定成功，不會立即提取，而是依照設置時間等待，時間結束後，才正式開始提取。</li><li><b>第三階段：提取及額外發送。</b>從目前聯絡人所有符合條件的歷史聊天訊息中，隨機挑選一句選取文字。提取成功後額外發送一則提取字卡訊息，訊息顯示「提取字卡」標籤、不佔用原本字卡回覆的消息條數。</li><li><b>第四階段：判定是否保存。</b>提取字卡發送後才依設置進行保存機率判定。若判定成功，將文字保存至提取字卡分類。若判定失敗，這張字卡只會在本次對話中發送，不會加入提取字卡收藏庫。</li></ul><p style="margin:0">無論保存與否，本次提取事件都會留下紀錄（包括來源、時間、是否被保存）。（主頁-靈感拾取-提取事件）</p>`)
+IR('重複字卡處理',`<p style="margin:0 0 8px">記憶字卡與提取字卡都採用相同的重複文字處理方式。相同文字只保留一張卡片，但允許累積多筆來源紀錄。</p><p style="margin:0 0 4px">例如，同一段文字被提取三次：</p><ul style="margin:0 0 8px;padding-left:20px"><li>不會建立三張相同內容的卡片。</li><li>只保留一張卡片。</li><li>將三次提取的來源分別記錄。</li></ul><p style="margin:0">如果使用者編輯過卡片文字，系統必須保留編輯結果，不可因為後續再次提取到原始文字而覆蓋使用者的修改。</p>`);

/* ── 梅花易數 ── */
const MH=(function(){
// meihua_full_analysis.js (修正版)
//
// 簡化版梅花易數完整分析器
//
// 本程式包含：

// 2. 動爻計算

// 9. 變卦趨勢
// 10. 簡化的綜合吉凶參考
//
// 修正紀錄：
// - 移除舊版「動爻影響」：動爻所在卦必定是用卦，舊版等於把「用 vs 體」重複計分，
//   且 relationToUse 永遠是「比和」。改為「體 vs 變卦用卦」。
// - 旺衰調整改為依體用關係決定正負號，不再一律「體分 − 用分」。
// - 互卦納入評分。
// - 修正「四季末季」的描述字串。
// - 範例只在直接執行檔案時才跑，被 require 時不會輸出。
// - 數字檢查改用 Number.isSafeInteger，避免超大數取餘失準。
//
// 注意：
// - 梅花易數有不同流派，體用、旺衰、應期的細節可能不同。
// - 本程式是可重現的規則化參考模型，不代表唯一正統解法。
// - 若沒有提供占問時間，就不能嚴謹判定月令旺衰；本程式會標示為「未提供」。

const TRIGRAMS = {
  1: { name: '乾', nature: '天', element: '金', lines: [1, 1, 1] },
  2: { name: '兌', nature: '澤', element: '金', lines: [1, 1, 0] },

  6: { name: '坎', nature: '水', element: '水', lines: [0, 1, 0] },
  7: { name: '艮', nature: '山', element: '土', lines: [0, 0, 1] },
  8: { name: '坤', nature: '地', element: '土', lines: [0, 0, 0] },
};

const HEXAGRAMS = {
  '11': '乾為天', '12': '天澤履', '13': '天火同人', '14': '天雷無妄',
  '15': '天風姤', '16': '天水訟', '17': '天山遯', '18': '天地否',
  '21': '澤天夬', '22': '兌為澤', '23': '澤火革', '24': '澤雷隨',
  '25': '澤風大過', '26': '澤水困', '27': '澤山咸', '28': '澤地萃',
  '31': '火天大有', '32': '火澤睽', '33': '離為火', '34': '火雷噬嗑',
  '35': '火風鼎', '36': '火水未濟', '37': '火山旅', '38': '火地晉',
  '41': '雷天大壯', '42': '雷澤歸妹', '43': '雷火豐', '44': '震為雷',
  '45': '雷風恆', '46': '雷水解', '47': '雷山小過', '48': '雷地豫',
  '51': '風天小畜', '52': '風澤中孚', '53': '風火家人', '54': '風雷益',
  '55': '巽為風', '56': '風水渙', '57': '風山漸', '58': '風地觀',
  '61': '水天需', '62': '水澤節', '63': '水火既濟', '64': '水雷屯',
  '65': '水風井', '66': '坎為水', '67': '水山蹇', '68': '水地比',
  '71': '山天大畜', '72': '山澤損', '73': '山火賁', '74': '山雷頤',
  '75': '山風蠱', '76': '山水蒙', '77': '艮為山', '78': '山地剝',
  '81': '地天泰', '82': '地澤臨', '83': '地火明夷', '84': '地雷復',
  '85': '地風升', '86': '地水師', '87': '地山謙', '88': '坤為地',
};

// key 生 value
const GENERATES = {
  木: '火',
  火: '土',
  土: '金',
  金: '水',
  水: '木',
};

// key 剋 value
const CONTROLS = {
  木: '土',
  土: '水',
  水: '火',
  火: '金',
  金: '木',
};

// 這裡採用常見的季節旺衰簡化表。
// 「旺、相、休、囚、死」是相對強弱，不是絕對吉凶。
const SEASON_STRENGTH = {
  春: { 木: '旺', 火: '相', 水: '休', 金: '囚', 土: '死' },
  夏: { 火: '旺', 土: '相', 木: '休', 水: '囚', 金: '死' },
  秋: { 金: '旺', 水: '相', 土: '休', 火: '囚', 木: '死' },
  冬: { 水: '旺', 木: '相', 金: '休', 土: '囚', 火: '死' },
  四季末: { 土: '旺', 金: '相', 火: '休', 木: '囚', 水: '死' },
};

const STRENGTH_SCORE = {
  旺: 4,
  相: 3,
  休: 2,
  囚: 1,
  死: 0,
};

// 旺衰分數以「休」(2) 為中點，轉成 -2 ~ +2 的偏移量。
const STRENGTH_CENTER = 2;

// 用卦旺衰對吉凶的方向：
// 用生體：用越旺，助力越大（+）
// 用剋體：用越旺，壓力越大（−）
// 體剋用：用越旺，越難掌控（−）
// 體生用：用越旺，耗洩越多（−）
// 比和：不調整
const USE_STRENGTH_SIGN = {
  用生體: 1,
  用剋體: -1,
  體剋用: -1,
  體生用: -1,
  比和: 0,
};

const VALID_ELEMENTS = new Set(['木', '火', '土', '金', '水']);
const VALID_SEASONS = new Set(Object.keys(SEASON_STRENGTH));

function validatePositiveInteger(value, name) {
  if (!Number.isSafeInteger(value) || value <= 0) {
    throw new TypeError(`${name} 必須是正整數（且不可超過 ${Number.MAX_SAFE_INTEGER}）。`);
  }
}

function modToTrigramNumber(value) {
  return value % 8 === 0 ? 8 : value % 8;
}

function modToMovingLine(value) {
  return value % 6 === 0 ? 6 : value % 6;
}

function getHexagramName(upperNumber, lowerNumber) {
  const key = `${upperNumber}${lowerNumber}`;
  if (!HEXAGRAMS[key]) {
    throw new Error(`找不到六十四卦資料：${key}`);
  }
  return HEXAGRAMS[key];
}

function linesToTrigramNumber(lines) {
  if (!Array.isArray(lines) || lines.length !== 3) {
    throw new Error('八卦爻線必須是長度為 3 的陣列。');
  }

  const entry = Object.entries(TRIGRAMS).find(([, trigram]) => {
    return trigram.lines.join('') === lines.join('');
  });

  if (!entry) {
    throw new Error(`找不到八卦爻線：${lines.join('')}`);
  }

  return Number(entry[0]);
}

function getRelation(bodyElement, useElement) {
  if (!VALID_ELEMENTS.has(bodyElement) || !VALID_ELEMENTS.has(useElement)) {
    throw new Error(`無效的五行：體=${bodyElement}，用=${useElement}`);
  }

  if (bodyElement === useElement) {
    return {
      type: '比和',
      basicScore: 1,
      description: '體用同氣，通常代表平穩、協調。',
    };
  }

  if (GENERATES[useElement] === bodyElement) {
    return {
      type: '用生體',
      basicScore: 3,
      description: '用卦生體卦，通常代表外部助力、資源或對方對自己有利。',
    };
  }

  if (GENERATES[bodyElement] === useElement) {
    return {
      type: '體生用',
      basicScore: -1,
      description: '體卦生用卦，通常代表自己付出較多、能量或資源向外流失。',
    };
  }

  if (CONTROLS[bodyElement] === useElement) {
    return {
      type: '體剋用',
      basicScore: 2,
      description: '體卦剋用卦，通常代表自己有掌控力，但往往需要努力、競爭或付出。',
    };
  }

  if (CONTROLS[useElement] === bodyElement) {
    return {
      type: '用剋體',
      basicScore: -3,
      description: '用卦剋體卦，通常代表外在壓力、阻礙或對手力量較強。',
    };
  }

  throw new Error(`無法判斷五行關係：體=${bodyElement}，用=${useElement}`);
}

function getSeasonStrength(element, season) {
  if (!season) {
    return {
      season: null,
      status: '未提供',
      score: null,
      description: '未提供占問時間，暫不判斷月令旺衰。',
    };
  }

  if (!VALID_SEASONS.has(season)) {
    throw new Error(`season 必須是：${[...VALID_SEASONS].join('、')}。`);
  }

  const status = SEASON_STRENGTH[season][element];
  const seasonLabel = season === '四季末' ? season : `${season}季`;
  return {
    season,
    status,
    score: STRENGTH_SCORE[status],
    description: `${seasonLabel}${element}屬於「${status}」。`,
  };
}

// 旺衰調整：體旺為吉；用卦旺衰的方向依體用關係而定。
function getStrengthAdjustment(relation, bodyStrength, useStrength) {
  if (bodyStrength.score === null || useStrength.score === null) {
    return {
      score: 0,
      description: '未提供季節，不做旺衰調整。',
    };
  }

  const bodyShift = bodyStrength.score - STRENGTH_CENTER;
  const useShift =
    (useStrength.score - STRENGTH_CENTER) * USE_STRENGTH_SIGN[relation.type];
  // 避免產生 -0
  const score = bodyShift + useShift + 0;

  return {
    score,
    description:
      `體卦${bodyStrength.status}（${bodyShift >= 0 ? '+' : ''}${bodyShift}），` +
      `用卦${useStrength.status}（${useShift >= 0 ? '+' : ''}${useShift}，依「${relation.type}」判斷方向）。`,
  };
}

// 動爻變後的影響：只有動爻所在的卦（用卦）會改變，
// 因此看「體卦」與「變卦用卦」的新關係，代表事情發展後的結果傾向。
function getChangeEffect(movingLine, body, use, changedUse) {
  const changedRelation = getRelation(body.element, changedUse.element);
  const useElementChanged = use.element !== changedUse.element;

  return {
    line: movingLine,
    movingSide: movingLine >= 4 ? '上卦' : '下卦',
    useGua: use.name,
    useElement: use.element,
    changedUseGua: changedUse.name,
    changedUseElement: changedUse.element,
    useElementChanged,
    relationType: changedRelation.type,
    score: changedRelation.basicScore,
    description:
      `動爻變後，用卦由「${use.name}（${use.element}）」變為「${changedUse.name}（${changedUse.element}）」，` +
      `與體卦成「${changedRelation.type}」。${changedRelation.description}`,
  };
}

// 互卦的影響：互卦上下兩卦與體卦的關係（互卦代表事情的過程、內在因素）。
// 每個互卦：生體 +1、體剋 +1、比和 0、體生 −1、剋體 −1，合計 −2 ~ +2。
function getHuEffect(body, huUpper, huLower) {
  const scoreOf = (trigram) => {
    const relation = getRelation(body.element, trigram.element);
    const score = { 用生體: 1, 體剋用: 1, 比和: 0, 體生用: -1, 用剋體: -1 }[relation.type];
    return {
      trigram: trigram.name,
      element: trigram.element,
      relationType: relation.type,
      score,
    };
  };

  const upper = scoreOf(huUpper);
  const lower = scoreOf(huLower);
  const total = upper.score + lower.score;

  return {
    upper,
    lower,
    score: total,
    description:
      `互卦上卦「${upper.trigram}」與體為「${upper.relationType}」，` +
      `互卦下卦「${lower.trigram}」與體為「${lower.relationType}」，` +
      `代表過程中的助力與阻力${total > 0 ? '偏順' : total < 0 ? '偏逆' : '大致相當'}。`,
  };
}

function getTrend(benGua, huGua, bianGua, relation, changeEffect) {
  let description;
  if (relation.type === changeEffect.relationType) {
    description = `本卦與變卦的體用主關係都為「${relation.type}」，整體方向較一致。`;
  } else {
    description = `本卦為「${relation.type}」，變卦轉為「${changeEffect.relationType}」，後續局勢可能出現轉折。`;
  }

  return {
    benGua,
    huGua,
    bianGua,
    changedRelationType: changeEffect.relationType,
    description,
  };
}

// 分數範圍約 −12 ~ +12：體用 ±3、變卦 ±3、互卦 ±2、旺衰 ±4。
function getOverallJudgement(totalScore) {
  if (totalScore >= 6) {
    return {
      level: '偏吉',
      description: '助力較多，事情成功條件較佳，但仍需配合實際行動。',
    };
  }
  if (totalScore >= 3) {
    return {
      level: '小吉',
      description: '有可成之象，但可能需要努力、等待或處理細節。',
    };
  }
  if (totalScore >= -2) {

function castHexagram(num1, num2, options = {}) {
  validatePositiveInteger(num1, 'num1');
  validatePositiveInteger(num2, 'num2');

  const { season = null } = options;

  const upperNumber = modToTrigramNumber(num1);
  const lowerNumber = modToTrigramNumber(num2);
  const movingTotal = options.movingTotal != null ? options.movingTotal : num1 + num2;
  const movingLine = modToMovingLine(movingTotal);

  const upper = TRIGRAMS[upperNumber];
  const lower = TRIGRAMS[lowerNumber];
  // 爻線由下往上：初爻、二爻、三爻（下卦），四爻、五爻、上爻（上卦）
  const originalLines = [...lower.lines, ...upper.lines];

  const benGua = getHexagramName(upperNumber, lowerNumber);

  // 互卦：二、三、四爻為下互卦；三、四、五爻為上互卦。
  const huLowerNumber = linesToTrigramNumber(originalLines.slice(1, 4));
  const huUpperNumber = linesToTrigramNumber(originalLines.slice(2, 5));
  const huGua = getHexagramName(huUpperNumber, huLowerNumber);
  const huUpper = TRIGRAMS[huUpperNumber];
  const huLower = TRIGRAMS[huLowerNumber];

  // 變卦：動爻陰陽互換。
  const changedLines = [...originalLines];
  changedLines[movingLine - 1] = changedLines[movingLine - 1] === 1 ? 0 : 1;
  const bianLowerNumber = linesToTrigramNumber(changedLines.slice(0, 3));
  const bianUpperNumber = linesToTrigramNumber(changedLines.slice(3, 6));
  const bianGua = getHexagramName(bianUpperNumber, bianLowerNumber);
  const changedUpper = TRIGRAMS[bianUpperNumber];
  const changedLower = TRIGRAMS[bianLowerNumber];

  // 動爻在上卦：上卦為用、下卦為體；動爻在下卦：下卦為用、上卦為體。
  const isUpperMoving = movingLine >= 4;
  const body = isUpperMoving ? lower : upper;
  const use = isUpperMoving ? upper : lower;
  // 只有動爻所在的卦會改變，體卦在變卦中不變。
  const changedUse = isUpperMoving ? changedUpper : changedLower;

  const relation = getRelation(body.element, use.element);
  const bodyStrength = getSeasonStrength(body.element, season);
  const useStrength = getSeasonStrength(use.element, season);
  const changeEffect = getChangeEffect(movingLine, body, use, changedUse);
  const huEffect = getHuEffect(body, huUpper, huLower);
  const strengthAdjustment = getStrengthAdjustment(relation, bodyStrength, useStrength);

  // 綜合分數是規則化參考，不是傳統流派唯一標準。
  const totalScore =
    relation.basicScore +
    changeEffect.score +
    huEffect.score +
    strengthAdjustment.score;

  const trend = getTrend(benGua, huGua, bianGua, relation, changeEffect);
  const overall = getOverallJudgement(totalScore);

  return {
    input: { num1, num2 },
    calculation: {
      upperRemainder: num1 % 8,
      lowerRemainder: num2 % 8,
      sum: num1 + num2,
      movingTotal,
      movingLineRemainder: movingTotal % 6,
    },
    movingLine,
    upperGua: upper.name,
    upperNature: upper.nature,
    upperElement: upper.element,
    lowerGua: lower.name,
    lowerNature: lower.nature,
    lowerElement: lower.element,
    originalLines,
    benGua,
    huGua,
    huUpperGua: huUpper.name,
    huUpperElement: huUpper.element,
    huLowerGua: huLower.name,
    huLowerElement: huLower.element,
    changedLines,
    bianGua,
    bianUpperGua: changedUpper.name,
    bianUpperElement: changedUpper.element,
    bianLowerGua: changedLower.name,
    bianLowerElement: changedLower.element,
    bodyGua: body.name,
    bodyElement: body.element,
    bodySide: isUpperMoving ? '下卦' : '上卦',
    useGua: use.name,
    useElement: use.element,
    useSide: isUpperMoving ? '上卦' : '下卦',
    relationType: relation.type,
    relationDescription: relation.description,
    season: season || '未提供',
    bodyStrength,
    useStrength,
    strengthAdjustment,
    changeEffect,
    huEffect,
    trend,
    score: {
      relation: relation.basicScore,
      change: changeEffect.score,
      hu: huEffect.score,
      strengthAdjustment: strengthAdjustment.score,
      total: totalScore,
    },
    overall,
  };
}

道、不要走太遠，重新開始會逐漸好轉；執迷不悟、遲遲不改則有災禍。", "元亨利貞。其匪正有眚，不利有攸往。|初九：無妄，往吉。|六二：不耕穫，不菑畬，則利有攸往。|六三：無妄之災，或繫之牛，行人之得，邑人之災。|九四：可貞，無咎。|九五：無妄之疾，勿藥有喜。|上九：無妄，行有眚，無攸利。||守真不妄|不虛妄、不投機，順著自然本分行事就亨通；若懷有不正的心思或強求，反而招災。偶遇意外也要平心處理，不亂用藥亂動作。", "利貞，不家食，吉，利涉大川。|初九：有厲，利已。|九二：輿說輹。|九三：良馬逐，利艱貞。曰閑輿衛，利有攸往。|六四：童牛之牿，元吉。|六五：豶豕之牙，吉。|上九：何天之衢，亨。||大量蓄積|積蓄能力、學識與德行，到一定程度再出來做事。目前宜蓄勢待發、控制衝動，等到暢通無阻時，就會有大的作為。", "貞吉。觀頤，自求口實。|初九：舍爾靈龜，觀我朵頤，凶。|六二：顛頤，拂經于丘頤，征凶。|六三：拂頤，貞凶，十年勿用，無攸利。|六四：顛頤，吉。虎視眈眈，其欲逐逐，無咎。|六五：拂經，居貞吉，不可涉大川。|上九：由頤，厲吉，利涉大川。||頤養自守|與「養」有關：要養身、養德，也要養人。慎言語、節飲食，靠自己正當努力獲取所需，不羨慕他人所有，才能健康吉祥。", "棟橈，利有攸往，亨。|初六：藉用白茅，無咎。|九二：枯楊生稊，老夫得其女妻，無不利。|九三：棟橈，凶。|九四：棟隆，吉；有它吝。|九五：枯楊生華，老婦得其士夫，無咎無譽。|上六：過涉滅頂，凶，無咎。||負擔過重|像樑柱承重過度而彎曲，局面中間過重、兩端太弱。需要非常手段與果斷處置，但要謹慎小心；若硬撐到底可能「滅頂」，要量力而為。", "習坎，有孚，維心亨，行有尚。|初六：習坎，入于坎窞，凶。|九二：坎有險，求小得。|六三：來之坎坎，險且枕，入于坎窞，勿用。|六四：樽酒簋貳，用缶，納約自牖，終無咎。|九五：坎不盈，祗既平，無咎。|上六：係用徽纆，寘于叢棘，三歲不得，凶。||重重險陷|一重又一重的險難，處境艱險。但只要保持誠信、內心堅定，就能在險中前行；不要冒進，一步步小心脫困，求小得而不求大。", "利貞，亨。畜牝牛，吉。|初九：履錯然，敬之，無咎。|六二：黃離，元吉。|九三：日昃之離，不鼓缶而歌，則大耋之嗟，凶。|九四：突如其來如，焚如，死如，棄如。|六五：出涕沱若，戚嗟若，吉。|上九：王用出征，有嘉折首，獲匪其醜，無咎。||光明附麗|如火光明亮、依附正道而發光。要像飼養溫順的牛一樣柔順守正，才能吉祥；火燃得太猛會自焚，行事要節制、珍惜當下。", "亨，利貞，取女吉。|初六：咸其拇。|六二：咸其腓，凶，居吉。|九三：咸其股，執其隨，往吝。|九四：貞吉，悔亡。憧憧往來，朋從爾思。|九五：咸其脢，無悔。|上六：咸其輔頰舌。||真心感應|兩情或人心之間的感應與交流。以真誠無私的心相感才亨通，婚戀事尤其吉；只靠花言巧語或心思亂動，感應就不深。", "亨，無咎，利貞，利有攸往。|初六：浚恆，貞凶，無攸利。|九二：悔亡。|九三：不恆其德，或承之羞，貞吝。|九四：田無禽。|六五：恆其德，貞，婦人吉，夫子凶。|上六：振恆，凶。||持之以恆|貴在長久堅持正道，不輕易改變方向。但「恆」不是死守不變，要能隨時調整；急求深入、搖擺不定、或動輒更張都不利。", "亨，小利貞。|初六：遯尾，厲，勿用有攸往。|六二：執之用黃牛之革，莫之勝說。|九三：係遯，有疾厲，畜臣妾吉。|九四：好遯，君子吉，小人否。|九五：嘉遯，貞吉。|上九：肥遯，無不利。||退避保身|小人漸盛的時候，君子宜適時退讓避開、保存實力。及早從容退出能平安；拖延不走或糾纏其中會有危險，退得好反而有利。", "利貞。|初九：壯于趾，征凶，有孚。|九二：貞吉。|九三：小人用壯，君子用罔，貞厲。羝羊觸藩，羸其角。|九四：貞吉，悔亡。藩決不羸，壯于大輿之輹。|六五：喪羊于易，無悔。|上六：羝羊觸藩，不能退，不能遂，無攸利，艱則吉。||強盛需正|力量強大、氣勢旺盛，但越強越要守正道、有節制。蠻幹像公羊衝撞籬笆會卡住角，靠實力同時守禮守規矩才得吉。", "康侯用錫馬蕃庶，晝日三接。|初六：晉如摧如，貞吉。罔孚，裕無咎。|六二：晉如愁如，貞吉。受茲介福，于其王母。|六三：眾允，悔亡。|九四：晉如鼫鼠，貞厲。|六五：悔亡，失得勿恤，往吉，無不利。|上九：晉其角，維用伐邑，厲吉無咎，貞吝。||上進晉升|像太陽升起，事業、地位逐步上升，得到肯定。要守正、虛心、不貪心；中途受挫也不要急，保持誠信就會有福。", "利艱貞。|初九：明夷于飛，垂其翼。君子于行，三日不食，有攸往，主人有言。|六二：明夷，夷于左股，用拯馬壯，吉。|九三：明夷于南狩，得其大首，不可疾貞。|六四：入于左腹，獲明夷之心，于出門庭。|六五：箕子之明夷，利貞。|上六：不明晦，初登于天，後入于地。||光明受傷|光明被遮蔽、賢者處在不利環境。宜韜光養晦、內明外柔，不鋒芒外露，堅持內心正道，熬過黑暗期後光明會再回來。", "利女貞。|初九：閑有家，悔亡。|六二：無攸遂，在中饋，貞吉。|九三：家人嗃嗃，悔厲吉；婦子嘻嘻，終吝。|六四：富家，大吉。|九五：王假有家，勿恤，吉。|上九：有孚威如，終吉。||齊家有序|講家庭與親近關係的經營。各人守好本分、立好規矩，又有愛與誠信，家就和順；管得太鬆或太嚴都不好，以誠相待最重要。", "小事吉。|初九：悔亡，喪馬勿逐，自復；見惡人，無咎。|九二：遇主于巷，無咎。|六三：見輿曳，其牛掣，其人天且劓，無初有終。|九四：睽孤，遇元夫，交孚，厲無咎。|六五：悔亡，厥宗噬膚，往何咎？|上九：睽孤，見豕負塗，載鬼一車，先張之弧，後說之弧，匪寇婚媾，往遇雨則吉。||乖違背離|彼此意見不合、關係疏離，大事不易成，只宜做小事。求同存異、保持溝通、不要猜疑，真誠相待後誤會往往能化解。", "利西南，不利東北。利見大人，貞吉。|初六：往蹇，來譽。|六二：王臣蹇蹇，匪躬之故。|九三：往蹇，來反。|六四：往蹇，來連。|九五：大蹇，朋來。|上六：往蹇，來碩，吉。利見大人。||險阻難行|前進遇到阻礙，像腳跛行走不便。宜停下來反省、找好助手與貴人，改變方向而不硬闖，在困難中修養自己，終能克服。", "利西南。無所往，其來復吉。有攸往，夙吉。|初六：無咎。|九二：田獲三狐，得黃矢，貞吉。|六三：負且乘，致寇至，貞吝。|九四：解而拇，朋至斯孚。|六五：君子維有解，吉；有孚于小人。|上六：公用射隼于高墉之上，獲之，無不利。||解除困難|困難紓解、緊張消散之象。要趁機把問題處理乾淨，有事早做早吉；不要再糾纏舊事，也要警惕德不配位招來麻煩。", "有孚，元吉，無咎，可貞，利有攸往。曷之用？二簋可用享。|初九：已事遄往，無咎，酌損之。|九二：利貞，征凶，弗損益之。|六三：三人行，則損一人；一人行，則得其友。|六四：損其疾，使遄有喜，無咎。|六五：或益之十朋之龜，弗克違，元吉。|上九：弗損益之，無咎，貞吉，利有攸往，得臣無家。||減損有益|有損才有益，在適當的地方減少、節制，反而帶來真正的收穫。誠心比排場重要，簡單一點也能表達心意，量力而為最好。", "利有攸往，利涉大川。|初九：利用為大作，元吉，無咎。|六二：或益之十朋之龜，弗克違，永貞吉。王用享于帝，吉。|六三：益之用凶事，無咎。有孚中行，告公用圭。|六四：中行，告公從。利用為依遷國。|九五：有孚惠心，勿問元吉。有孚惠我德。|上九：莫益之，或擊之，立心勿恆，凶。||增益受惠|上對下施益、彼此增益的好時機，宜積極進取、做有益大眾的事，得到助力。要持續保持善心；一旦動機轉為只顧自己，好運就會停止。", "揚于王庭，孚號，有厲。告自邑，不利即戎，利有攸往。|初九：壯于前趾，往不勝為咎。|九二：惕號，莫夜有戎，勿恤。|九三：壯于頄，有凶。君子夬夬，獨行遇雨，若濡有慍，無咎。|九四：臀無膚，其行次且。牽羊悔亡，聞言不信。|九五：莧陸夬夬，中行無咎。|上六：無號，終有凶。||果決除弊|要下決心清除小人與弊端，但要公開、有證據、以德服人，不宜以武力硬碰。果斷之中保持警惕與耐心，才不會反遭傷害。", "女壯，勿用取女。|初六：繫于金柅，貞吉，有攸往，見凶，羸豕孚蹢躅。|九二：包有魚，無咎，不利賓。|九三：臀無膚，其行次且，厲，無大咎。|九四：包無魚，起凶。|九五：以杞包瓜，含章，有隕自天。|上九：姤其角，吝，無咎。||不期而遇|意外的相遇或邂逅，來勢突然，要提防一開始看似小的影響逐步壯大。遇到時要保持界線、謹慎處理，不輕易深交。", "亨。王假有廟，利見大人，亨，利貞。用大牲吉，利有攸往。|初六：有孚不終，乃亂乃萃，若號，一握為笑，勿恤，往無咎。|六二：引吉，無咎，孚乃利用禴。|六三：萃如嗟如，無攸利，往無咎，小吝。|九四：大吉，無咎。|九五：萃有位，無咎。匪孚，元永貞，悔亡。|上六：齎咨涕洟，無咎。||聚集匯合|人事物彙聚的時候，需要有共同的目標與好的領導，才能凝聚人心。聚在一起要有防備，以誠信與禮制維持秩序，不然人多反而亂。", "元亨，用見大人，勿恤，南征吉。|初六：允升，大吉。|九二：孚乃利用禴，無咎。|九三：升虛邑。|六四：王用亨于岐山，吉，無咎。|六五：貞吉，升階。|上六：冥升，利于不息之貞。||逐步上升|像樹木生長一樣一步一步向上，事業與地位漸有進展，得到上位者的賞識。穩紮穩打、不躁進，到高處更要自我警醒、持續努力。", "亨，貞，大人吉，無咎。有言不信。|初六：臀困于株木，入于幽谷，三歲不覿。|九二：困于酒食，朱紱方來，利用享祀，征凶，無咎。|六三：困于石，據于蒺藜，入于其宮，不見其妻，凶。|九四：來徐徐，困于金車，吝，有終。|九五：劓刖，困于赤紱，乃徐有說，利用祭祀。|上六：困于葛藟，于臲卼，曰動悔，有悔，征吉。||困窘受限|處境困窘、資源受限，說話也不被相信。此時多說無益，保持信念、靜心修養，以不變的志向度過難關，終能由困轉通。", "改邑不改井，無喪無得，往來井井。汔至亦未繘井，羸其瓶，凶。|初六：井泥不食，舊井無禽。|九二：井谷射鮒，甕敝漏。|九三：井渫不食，為我心惻，可用汲，王明，並受其福。|六四：井甃，無咎。|九五：井冽，寒泉食。|上六：井收勿幕，有孚元吉。||養人不竭|像水井默默滋養眾人而不改常。要持續維護與修整，不能半途而廢；有才能就要被人用，並保持源頭清潔，長久才有好結果。", "己日乃孚，元亨利貞，悔亡。|初九：鞏用黃牛之革。|六二：己日乃革之，征吉，無咎。|九三：征凶，貞厲，革言三就，有孚。|九四：悔亡，有孚改命，吉。|九五：大人虎變，未占有孚。|上六：君子豹變，小人革面，征凶，居貞吉。||變革更新|時機成熟需要改革，但要等人心信服後再行動，不能操之過急。方案要多次商討、有誠信基礎，改革成功後局面煥然一新。", "元吉，亨。|初六：鼎顛趾，利出否，得妾以其子，無咎。|九二：鼎有實，我仇有疾，不我能即，吉。|九三：鼎耳革，其行塞，雉膏不食，方雨虧悔，終吉。|九四：鼎折足，覆公餗，其形渥，凶。|六五：鼎黃耳金鉉，利貞。|上九：鼎玉鉉，大吉，無不利。||鼎新成器|像鼎烹煮食物，象徵新秩序與成就的確立，是大吉亨通。要德才相稱、選對輔助者；若能力不足而承擔過重，鼎足折斷就會翻覆。", "亨。震來虩虩，笑言啞啞。震驚百里，不喪匕鬯。|初九：震來虩虩，後笑言啞啞，吉。|六二：震來厲，億喪貝，躋于九陵，勿逐，七日得。|六三：震蘇蘇，震行無眚。|九四：震遂泥。|六五：震往來厲，億無喪，有事。|上六：震索索，視矍矍，征凶。震不于其躬，于其鄰，無咎，婚媾有言。||雷動驚醒|突然的震動或驚嚇，雖然一時恐懼，卻能促人警醒、修省。保持鎮定、不亂陣腳，事過之後反而笑語平安，也不會丟掉原有的根本。", "艮其背，不獲其身，行其庭，不見其人，無咎。|初六：艮其趾，無咎，利永貞。|六二：艮其腓，不拯其隨，其心不快。|九三：艮其限，列其夤，厲薰心。|六四：艮其身，無咎。|六五：艮其輔，言有序，悔亡。|上九：敦艮，吉。||適時靜止|知止而後安，該停就停。控制慾望與妄動，守住當下，不強行向前；說話、行事都要有分寸，保持心定，才能避免災咎。", "女歸吉，利貞。|初六：鴻漸于干，小子厲，有言，無咎。|六二：鴻漸于磐，飲食衎衎，吉。|九三：鴻漸于陸，夫征不復，婦孕不育，凶。利禦寇。|六四：鴻漸于木，或得其桷，無咎。|九五：鴻漸于陵，婦三歲不孕，終莫之勝，吉。|上九：鴻漸于陸，其羽可用為儀，吉。||循序漸進|像大雁一步一步飛過水邊、岩石、樹木，事情宜按部就班、慢慢推進。如婚嫁般需要等待時機與程序，穩定積累終會有好結果。", "征凶，無攸利。|初九：歸妹以娣，跛能履，征吉。|九二：眇能視，利幽人之貞。|六三：歸妹以須，反歸以娣。|九四：歸妹愆期，遲歸有時。|六五：帝乙歸妹，其君之袂不如其娣之袂良，月幾望，吉。|上六：女承筐無實，士刲羊無血，無攸利。||名分不正|婚嫁或結合中位置、時機不夠正當，不宜急進。若硬要求成，容易有名無實、不得其所；宜守分守禮、耐心等待合適的時機。", "亨，王假之，勿憂，宜日中。|初九：遇其配主，雖旬無咎，往有尚。|六二：豐其蔀，日中見斗，往得疑疾，有孚發若，吉。|九三：豐其沛，日中見沬，折其右肱，無咎。|九四：豐其蔀，日中見斗，遇其夷主，吉。|六五：來章，有慶譽，吉。|上六：豐其屋，蔀其家，闚其戶，闃其無人，三歲不覿，凶。||盛大豐滿|事物達到盛大豐滿，如日正當中。此時宜把握時機、公平照顧各方；但盛極必衰，要有憂患意識，不炫耀、不封閉自己。", "小亨，旅貞吉。|初六：旅瑣瑣，斯其所取災。|六二：旅即次，懷其資，得童僕貞。|九三：旅焚其次，喪其童僕，貞厲。|九四：旅于處，得其資斧，我心不快。|六五：射雉一矢亡，終以譽命。|上九：鳥焚其巢，旅人先笑後號咷。喪牛于易，凶。||客旅在外|像在外作客，處境不穩，只宜小事、低調謹慎。待人要謙和，不要計較瑣碎或高傲；守住財物與人緣，才能平安度過。", "小亨，利有攸往，利見大人。|初六：進退，利武人之貞。|九二：巽在床下，用史巫紛若，吉，無咎。|九三：頻巽，吝。|六四：悔亡，田獲三品。|九五：貞吉，悔亡，無不利。無初有終，先庚三日，後庚三日，吉。|上九：巽在床下，喪其資斧，貞凶。||謙順入微|像風一樣無孔不入，以謙遜柔順的方式滲透、說服，小有亨通。命令要反覆申明、做事要果斷有決心；過度卑屈或猶豫不決都不好。", "亨，利貞。|初九：和兌，吉。|九二：孚兌，吉，悔亡。|六三：來兌，凶。|九四：商兌未寧，介疾有喜。|九五：孚于剝，有厲。|上六：引兌。||喜悅溝通|和悅愉快、能言善道之象，彼此交流讓人開心。要以誠懇和正道為基礎，別一味討好或沉溺享樂，被甜言蜜語引誘就容易出事。", "亨。王假有廟，利涉大川，利貞。|初六：用拯馬壯，吉。|九二：渙奔其機，悔亡。|六三：渙其躬，無悔。|六四：渙其群，元吉。渙有丘，匪夷所思。|九五：渙汗其大號，渙王居，無咎。|上九：渙其血，去逖出，無咎。||化散憂患|把凝結的心結、隔閡或僵局化開，使人心重新聚合。要用共同的信仰或目標來凝聚，放下私心與小團體，散開阻礙後局面更順暢。", "亨。苦節不可貞。|初九：不出戶庭，無咎。|九二：不出門庭，凶。|六三：不節若，則嗟若，無咎。|六四：安節，亨。|九五：甘節，吉，往有尚。|上六：苦節，貞凶，悔亡。||適度節制|凡事要有節制與界線，才能長久亨通。但節制不是苦行，過度壓抑、太苛刻無法持久；要找到舒適而可行的分寸，並選對時機行動。", "豚魚吉，利涉大川，利貞。|初九：虞吉，有它不燕。|九二：鳴鶴在陰，其子和之；我有好爵，吾與爾靡之。|六三：得敵，或鼓或罷，或泣或歌。|六四：月幾望，馬匹亡，無咎。|九五：有孚攣如，無咎。|上九：翰音登于天，貞凶。||誠信感通|內心誠信、虛懷若谷，連小豬與魚都能被感動。待人真誠就能感通彼此、共同克服困難；但光說不做、虛名在外就不會長久。", "亨，利貞。可小事，不可大事。飛鳥遺之音，不宜上，宜下，大吉。|初六：飛鳥以凶。|六二：過其祖，遇其妣；不及其君，遇其臣；無咎。|九三：弗過防之，從或戕之，凶。|九四：無咎，弗過遇之。往厲必戒，勿用永貞。|六五：密雲不雨，自我西郊，公弋取彼在穴。|上六：弗遇過之，飛鳥離之，凶，是謂災眚。||小事可為|小處稍微過一點可以，大事就不宜。做事低調、謙虛、重細節，向下沉穩而不往高處冒進，小事做好就能吉；勉強去做大事會有麻煩。", "亨小，利貞，初吉終亂。|初九：曳其輪，濡其尾，無咎。|六二：婦喪其茀，勿逐，七日得。|九三：高宗伐鬼方，三年克之，小人勿用。|六四：繻有衣袽，終日戒。|九五：東鄰殺牛，不如西鄰之禴祭，實受其福。|上六：濡其首，厲。||事已成功|事情大致完成、各就其位。但盛極而衰，越是成功越要居安思危、持續警惕；一開始吉，放鬆後容易出亂，要保持謹慎、防小漏洞。", "亨，小狐汔濟，濡其尾，無攸利。|初六：濡其尾，吝。|九二：曳其輪，貞吉。|六三：未濟，征凶，利涉大川。|九四：貞吉，悔亡，震用伐鬼方，三年有賞于大國。|六五：貞吉，無悔。君子之光，有孚，吉。|上九：有孚于飲酒，無咎；濡其首，有孚失是。||尚未完成|事情還沒完成、仍有轉機。要看清情勢、不能急躁，像小狐狸過河最怕在終點濕了尾巴。謹慎收尾、穩住節奏，下一個循環就有新機會。"];
const MH_YT=["時機未到，先潛心蓄力，不要妄動。|才能開始顯露，適合出來見貴人、請教前輩。|整天勤奮、夜裡仍警惕反省，雖處危險也能無災。|可以試著進取，也可退回穩守，量力而行就無咎（不會有過失）。|位置與時機最好，大展身手，適合與貴人相見。|爬到頂點過於高亢，物極必反，宜收斂防後悔。", "看到薄霜就知嚴寒將臨，小跡象要及早留意。|正直、端方、廣大，順著本性做事自然沒有不利。|把才華含蓄收藏，守正而不爭功，成果歸於上位。|像把袋口紮緊，少說話、少表態，無咎無譽（沒有過失，也沒有讚譽），謹慎免禍但也無名。|像穿著低調高貴的黃色衣裳，內斂有德，大吉。|陰盛到極點與陽相爭，兩敗俱傷，要避免硬碰。", "起步時徘徊不前，宜守正、先打好基礎並尋找助手。|困難重重、進退兩難；對方不是來搶而是求婚，要耐心等十年才有結果。|沒有嚮導就追鹿入林，貿然行動會吃虧，不如放棄。|看清形勢，主動求援合作，前進吉利。|恩惠被卡住不能廣施，小事可行，大事強推有凶。|走投無路、傷心流淚，要靠求助與反省。", "開始啟蒙需有規矩約束，過度放縱會有困難。|能包容愚昧者並加以引導，吉；善於持家也吉。|見到有錢人就失去自我，這種選擇沒有好處，要保持自主。|困在愚昧中又不肯學習，會有羞吝。|以純真謙虛的態度求教，吉。|對頑固的蒙昧要適度嚴厲糾正，但要防範過度。", "在遠郊等待，還離危險很遠，保持恆心就無災。|等在沙地，有些閒言閒語，最後仍吉。|等在泥濘邊，離險境很近，容易招來外敵，要謹慎。|陷入危險，要設法退出險地，保住安全。|等待時安心飲食休養，守正吉。|進入險境，有意外的三位客人來，恭敬相待終吉。", "不要把爭訟拖長，小有口舌，終究吉。|爭不過就退回，離開避禍，鄉里平安。|靠舊有的德行維持，守正，終吉；為公事不求功。|打不贏就回頭，改變主意安守正道，吉。|由公正者裁斷，是大吉。|即使因爭訟得到賞賜，也很快又被剝奪，不可恃。", "出兵必須有紀律，否則即使贏也是凶。|身在軍中居中指揮，吉無咎（不會有過失），並受上位重賞。|指揮不一，載屍而歸，凶。|暫時退守，不勉強進攻，無咎（不會有過失）。|有可執之理才出手，無咎（不會有過失）；用對的人當統帥，用錯則凶。|論功行賞，小人不可重用。", "以誠信與人親近，無咎（不會有過失），真誠充實終有它吉。|從內部、自己主動誠心親附，守正吉。|親近到不合適的人，要小心。|向外親近賢者，守正吉。|光明正大地親近，不強求，大方自然，吉。|沒有領頭人就想親附，結果凶。", "回到自己的正道，有什麼咎，吉。|被牽引著返回正道，吉。|車輪脫落，夫妻反目，因強行前進而失和。|有誠信，擔憂和血光都能離去，無咎（不會有過失）。|誠信牽連，連鄰居一起富足，要互助。|雨已下、事已成，重德行；此時月近滿，不宜再進。", "以樸素本分的態度前行，往前無咎（不會有過失）。|道路平坦，守正的隱者吉。|能力有限卻硬要逞強，踩到虎尾被咬，凶。|雖踩虎尾但極度謹慎，終吉。|決斷果敢地走，但守正也有危險。|回顧走過的路、檢視吉凶，圓滿大吉。", "拔起茅草連根帶出，與同類一同前進，吉。|包容荒穢、勇於涉險、不遺漏遠方，得到中道的支持。|沒有永遠平坦、沒有只去不返，艱難中守正無咎（不會有過失），享福。|輕鬆地與鄰居往來，不靠財富，也不必告誡就能互信。|君王嫁女、降尊相親，得福大吉。|城牆倒回護城河，泰極轉否，不要再動兵，守正也有憾。", "同類一同進退，守正吉亨。|包容順從，小人吉，大人在閉塞中守住自己亨通。|被迫容忍羞辱之事，處境尷尬。|有上命而行，無咎（不會有過失），同伴也得福。|使閉塞停止，大人吉；要時時警戒，像繫在桑樹根上。|閉塞被推翻，先否後喜。", "在家門口就與人和同，無咎（不會有過失）。|只和同宗親近，格局小，有憾。|埋伏兵於草叢，疑心重，久久不能起事。|爬上城牆卻不攻，知難而退，吉。|先痛哭後歡笑，大軍終能會合。|在遠郊和同，雖不深入也無悔。", "不與害人之事交往，無咎（不會有過失），艱難時小心則無災。|用大車裝載，有能力承擔，前往無咎（不會有過失）。|公侯向天子獻上財物，小人做不到。|不炫耀盛大，無咎（不會有過失）。|以誠信相交又有威嚴，吉。|上天保佑，吉無不利。", "極度謙虛的君子，可以渡過大河，吉。|謙名遠播，守正吉。|有功勞又謙虛，有好結果，吉。|處處發揮謙德，無所不利。|不倚仗財富，可以出兵討伐不服者，無不利。|謙德昭著，可以用兵整頓邑國。", "得意到張揚，凶。|像石頭般堅定，不整天耽於享樂，守正吉。|仰望別人求快樂，後悔；遲疑也後悔。|由你帶來歡樂，大有所得，不要懷疑，朋友會聚合。|長期有隱疾，但不會死，要有節制。|沉迷享樂，若能改變則無咎（不會有過失）。", "職守有變，守正吉；出門與人交往有功。|跟了小的，失去大的 let AC=null;
function acx(){try{if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AC=new C()}if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
['pointerdown','touchstart','keydown'].forEach(ev=>document.addEventListener(ev,()=>{acx()},{passive:true}));
const SND=[['bubble','泡泡'],['drop','水滴'],['ding','叮咚'],['chime','風鈴'],['tap','輕敲'],['bird','小鳥'],['marimba','馬林巴'],['soft','柔和提示']];
function sTone(a,t,f0,f1,dur,vol,type){const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f0,t);if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+dur);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.012);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+0.03)}
function sNoise(a,t,dur,vol,hp){const n=Math.max(1,Math.floor(a.sampleRate*dur)),buf=a.createBuffer(1,n,a.sampleRate),d=buf.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp;const g=a.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);s.connect(f);f.connect(g);g.connect(a.destination);s.start(t)}
function playSnd(k){try{const a=acx();if(!a||!k||k==='none')return;const t=a.currentTime+0.02;
  switch(k){
  case 'bubble':sTone(a,t,300,820,0.13,0.3);sTone(a,t+0.15,420,1000,0.09,0.16);sTone(a,t+0.34,1900,320,0.045,0.3);sNoise(a,t+0.34,0.07,0.22,2600);break;
  case 'drop':sTone(a,t,1250,480,0.12,0.3);sTone(a,t+0.13,900,420,0.1,0.1);break;
  case 'ding':sTone(a,t,1319,0,0.5,0.22);sTone(a,t+0.16,1047,0,0.6,0.22);break;
  case 'chime':[1568,1760,2093,2349,2637].forEach((f,i)=>sTone(a,t+i*0.07,f,0,0.65,0.1));break;
  case 'tap':sTone(a,t,240,110,0.09,0.35);sNoise(a,t,0.03,0.1,1800);break;
  case 'bird':[0,0.11,0.22].forEach((d,i)=>sTone(a,t+d,2300+i*250,3300+i*250,0.08,0.13));break;
  case 'marimba':[[659,0],[880,0.14]].forEach(([f,d])=>{sTone(a,t+d,f,0,0.35,0.3);sTone(a,t+d,f*4,0,0.06,0.07)});break;
  case 'soft':sTone(a,t,660,0,0.28,0.2);sTone(a,t+0.12,880,0,0.4,0.2);break}
}catch(e){}}

function perGroups(){const ds=Array.from(new Set(S.per.days)).sort(),g=[];ds.forEach(k=>{const l=g[g.length-1];if(l&&pDiff(k,l.e)===1){l.e=k;l.n++}else g.push({s:k,e:k,n:1})});return g}
function perStat(){const g=perGroups(),d=[];for(let i=1;i<g.length;i++){const x=pDiff(g[i].s,g[i-1].s);if(x>=15&&x<=60)d.push(x)}const ls=g.map(x=>x.n).filter(n=>n<=15);if(!d.length||!ls.length)return{};return{cyc:Math.round(d.reduce((a,b)=>a+b,0)/d.length),len:Math.round(ls.reduce((a,b)=>a+b,0)/ls.length)}}
function perCalc(){const p=S.per,g=perGroups(),map={},R={fw:1,ov:2,pp:3,p:4};

  g.forEach(x=>fert(pAdd(x.s,-14)));
  const out={g,map,cyc,len};
  if(g.length){const last=g[g.length-1];for(let k=1;k<=6;k++){const st=pAdd(last.s,cyc*k);for(let j=0;j<len;j++)mark(pAdd(st,j),'pp');fert(pAdd(st,-14))}out.next=pAdd(last.s,cyc);out.ov=pAdd(out.next,-14)}

/* 先排好本輪所有留言與送出時間：每條字卡後 emoji／顏文字各自等待選擇時間再判定；表情包每輪只判定一次，抽中當作一條留言插在隨機位置（與聊天室相同） */
/* 你留言／回覆後，被回覆的聯絡人依回覆設置的機率判定是否回覆你；你再回覆，就再判定一次，直到判定失敗或你不再回覆 */
function mcmUser(post,cm,tcid){if(!S.set.crOn||!post||post.cid==='me'||!cm||!cm.id||!S.contacts.some(c=>c.id===tcid))return;S.mcm=S.mcm||[];S.mcm.push({id:uid(),k:'u',cid:tcid,pid:post.id,mid:cm.id,to:S.me,ph:'j',due:Date.now()+1000})}
function mcmBuild(j,n){const cf=mcmCfg(j.k),cid=j.cid,pl=cardPool(cid);if(!pl.length)return[];
  const EJ=pool('emj',cid),KA=pool('kao',cid),cnt=(a,b)=>Math.max(1,momRange(a,b));let off=n;const out=[];
  for(let i=0,N=cnt(cf.nmin,cf.nmax);i<N;i++){
    const x=Array.from({length:cnt(cf.fmin,cf.fmax)},()=>{let c=pk(pl).text;[[EJ,cf.emj,cf.emjT],[KA,cf.kao,cf.kaoT]].sort(()=>rnd()-.5).forEach(([items,p,T])=>{if(p<=0)return;off+=Math.max(0,+T||0)*1000;if(items.length&&momHit(p)){const z=pk(items).text;c=rnd()<.5?z+' '+c:c+' '+z}});return c}).reduce(cjR,'');
    out.push({x,at:off});off+=MCM_GAP}
  const em=pool('emoji',cid);if(em.length&&momHit(cf.ep)){const e=mItem(pk(em));out.splice(ri(out.length+1),0,{x:e.x,img:e.img,at:null})}
  let prev=n-MCM_GAP;out.forEach(o=>{o.at=Math.max(o.at==null?0:o.at,prev+MCM_GAP);prev=o.at});return out}
function mcmSend(j,o,post){const c=S.contacts.find(x=>x.id===j.cid);if(!c)return;post.cmts=Array.isArray(post.cmts)?post.cmts:[];const m={id:uid(),cid:j.cid,n:c.name,x:o.x||'',img:o.img||''};if(j.k!=='p'){m.rt=j.to;m.rid=j.mid}post.cmts.push(m);if(j.k==='p')mcmReply(post,m)}
function mcmTick(){if(!S||!S.mcm||!S.mcm.length)return false;const n=Date.now(),s=S.set;let ch=false;const list=S.mcm;S.mcm=[];const keep=S.mcm;
  list.forEach(j=>{const post=S.moments.find(x=>x.id===j.pid);if(!post||!S.contacts.some(c=>c.id===j.cid)||!(j.k==='p'?s.cmOn:s.crOn)){ch=true;return}
    if(j.due>n){keep.push(j);return}ch=true;
    if(j.ph==='j'){const cf=mcmCfg(j.k);if(momHit(cf.prob)){j.ph='w';j.due=n+inspRand(cf.tmin,cf.tmax);keep.push(j)}return}
    if(j.ph==='w'){j.q=mcmBuild(j,n);if(j.q.length){j.ph='s';j.due=j.q[0].at;keep.push(j)}return}
    if(j.ph==='s'){const o=j.q.shift();mcmSend(j,o,post);if(j.q.length){j.due=j.q[0].at;keep.push(j)}}});
  return ch}

   +'<div class="card" style="margin-top:12px"><h3 style="margin:0 0 8px;font-weight:500">備份</h3><button class="btn s" style="width:100%;margin:0" data-a="bak">備份與還原</button><p class="hint" style="margin:8px 0 0">清除聊天紀錄、信箱前建議先備份。iPhone 的 Safari 若長時間沒有開啟，可能自動清掉網頁資料；把 Pearla 加入主畫面並定期備份最保險。</p></div>'}
function dQuota(){const e=$('#dq');if(!e)return;if(!(navigator.storage&&navigator.storage.estimate)){e.textContent='這個瀏覽器無法讀取可用空間。';return}
  navigator.storage.estimate().then(r=>{const el=$('#dq');if(!el)return;el.textContent=r&&r.quota?'瀏覽器配給的空間約 '+dFmt(r.quota)+'，網頁整體已用約 '+dFmt(r.usage||0)+'。':'無法取得瀏覽器可用空間。'}).catch(()=>{const el=$('#dq');if(el)el.textContent='無法取得瀏覽器可用空間。'})}
function dClear(id){const ids=S.contacts.map(c=>c.id),gs=S.groups||[];
  if(id==='chat'){ids.forEach(k=>{S.msgs[k]=[];S.un[k]=0});Object.keys(S.rounds).forEach(k=>{if(k.indexOf('|')<0)delete S.rounds[k]})}
  else if(id==='grp'){gs.forEach(g=>{S.msgs[g.id]=[];S.un[g.id]=0});Object.keys(S.rounds).forEach(k=>{if(k.indexOf('|')>0)delete S.rounds[k]})}
  else if(id==='insp')S.insp={mem:[],ext:[],ev:[]};
  else if(id==='plum')S.plum=[];
  else if(id==='book')S.book=[];
  else if(id==='mail')S.letters=[];
  else if(id==='qlog')S.qlog=[]}

/* ── 圖片壓縮 ── */
let icState=null;
const IC_LV={std:{n:'標準',bg:[900,.7],img:[720,.78]},hi:{n:'強力',bg:[720,.6],img:[540,.65]}};
function imgRecompress(u,max,q){return new Promise(res=>{const m=/^data:image\/(\w+)/.exec(u);if(!m||m[1]==='gif'||m[1]==='svg'){res(null);return}const im=new Image();
  im.onload=()=>{try{const sc=Math.min(1,max/Math.max(im.width,im.height)),w=Math.max(1,Math.round(im.width*sc)),h=Math.max(1,Math.round(im.height*sc)),c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
    if(m[1]==='png'||m[1]==='webp'){x.drawImage(im,0,0,w,h);const d=x.getImageData(0,0,w,h).data;for(let i=3;i<d.length;i+=4)if(d[i]<250){res(null);return}}
    x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);res(c.toDataURL('image/jpeg',q))}catch(e){res(null)}};im.onerror=()=>res(null);im.src=u})}
function icTargets(sc){const t=[],add=(kind,get,set)=>{const u=get();if(typeof u==='string'&&u.startsWith('data:image/')&&u.length>30000)t.push({kind,set,len:u.length,u})};
  if(sc.bg){if(S.bgAll)add('bg',()=>S.bgAll,v=>{S.bgAll=v});Object.keys(S.bgs||{}).forEach(k=>add('bg',()=>S.bgs[k],v=>{S.bgs[k]=v}))}
  if(sc.img)S.cards.forEach(k=>{if(k.img)add('img',()=>k.img,v=>{k.img=v})});
  if(sc.msg){Object.keys(S.msgs).forEach(id=>(S.msgs[id]||[]).forEach(m=>{if(m.img)add('img',()=>m.img,v=>{m.img=v})}));(S.letters||[]).forEach(L=>(L.imgs||[]).forEach((u,i)=>add('img',()=>L.imgs[i],v=>{L.imgs[i]=v})))}
  return t}
function icSheet(){const st=icState;if(!st)return;const all={bg:icTargets({bg:1}),img:icTargets({img:1}),msg:icTargets({msg:1})},fm=a=>a.length+' 張 · '+dFmt(a.reduce((x,y)=>x+y.len,0));
  const row=(k,n)=>'<div class="lt pick gmem'+(st.scope[k]?' sel':'')+'" data-a="ictg" data-i="'+k+'"><span style="flex:1;min-width:0">'+n+'<br><small style="color:var(--soft)">'+fm(all[k])+'</small></span><span class="ck '+(st.scope[k]?'on':'')+'"></span></div>';
  const info=st.busy?'<p class="hint" style="margin:8px 0">掃描中 '+esc(st.prog||'')+'⋯</p>':st.res?'<p style="margin:8px 0;font-size:14px">'+(st.res.list.length?'可壓縮 '+st.res.list.length+' 張（共掃描 '+st.res.total+' 張），預計省下約 '+dFmt(st.res.saved):'沒有可再壓縮的圖片（共掃描 '+st.res.total+' 張）')+'</p>':'';
  sheet('壓縮現有圖片','<p class="hint" style="margin:0 0 6px">壓縮不可還原，建議先備份。掃描時不會改動任何圖片。</p>'+row('bg','背景')+row('img','表情包')+row('msg','聊天與信件中的圖片')
   +'<div class="seg" style="margin:10px 0 4px">'+['std','hi'].map(k=>'<button class="'+(st.level===k?'on':'')+'" data-a="iclv" data-i="'+k+'">'+IC_LV[k].n+'</button>').join('')+'</div><p class="hint" style="margin:0 0 4px">標準：表情包最長邊 720px、畫質 78%；強力：540px、畫質 65%（背景保留較大尺寸）。</p>'+info
   +(st.res&&st.res.list.length?'<button class="btn d" data-a="icgo">套用壓縮</button>':'<button class="btn s" data-a="icscan"'+(st.busy?' disabled':'')+'>'+(st.busy?'掃描中⋯':'開始掃描')+'</button>')+'<button class="btn" data-a="bak">先去備份</button><button class="btn" data-a="close">關閉</button>',1)}
async function icScan(){const st=icState;st.busy=true;st.res=null;icSheet();const lv=IC_LV[st.level],ts=icTargets({bg:st.scope.bg,img:st.scope.img,msg:st.scope.msg}),cache=new Map(),list=[];let n=0;
  for(const t of ts){n++;const p=t.kind==='bg'?lv.bg:lv.img,key=p.join('/')+t.u;let nu=cache.get(key);if(nu===undefined){nu=await imgRecompress(t.u,p[0],p[1]);cache.set(key,nu)}if(nu&&nu.length<t.len*.9)list.push({t,nu});if(n%2===0){st.prog=n+'/'+ts.length;icSheet()}}
  st.res={list,total:ts.length,saved:list.reduce((a,x)=>a+x.t.len-x.nu.length,0)};st.busy=false;icSheet()}

// pen-synth.js — 合成版寫信沙沙聲（備援：找不到音檔時使用）
// 用法：
//   PenSound.attach(document.querySelector('#letterTextarea'));
//   PenSound.setEnabled(true);   // 預設關閉，之後接設置開關
//   PenSound.setVolume(0.5);     // 0 ~ 1
const PenSynth = (() => {
  // 連續的書寫音：先合成一段約 6 秒、由許多筆畫組成的紙上書寫聲，打字時循環播放，
  // 停止打字約 0.35 秒後淡出並停止。
  let ctx = null, loop = null, enabled = false, volume = 0.7;
  let src = null, gain = null, idle = null, playing = false;
  const IDLE_MS = 350;

  function makeLoop() {
    const sr = ctx.sampleRate, dur = 6, n = Math.floor(sr * dur);
    const buf = ctx.createBuffer(1, n, sr), d = buf.getChannelData(0);
    // 1) 筆畫排程：每劃一道速度先升後降，筆畫之間有短暫換向；偶爾有較長的停頓（換字）
    const sp = new Float32Array(n), fq = new Float32Array(n);
    let t = 0.15;
    while (t < dur - 0.6) {
      const len = 0.12 + Math.random() * 0.34, a = 0.55 + Math.random() * 0.45, f = 0.7 + Math.random() * 0.6;
      const i0 = Math.floor(t * sr), i1 = Math.min(n - 1, Math.floor((t + len) * sr));
      for (let i = i0; i <= i1; i++) {
        const x = (i - i0) / Math.max(1, i1 - i0), v = Math.pow(Math.sin(Math.PI * x), 0.8) * a;
        if (v > sp[i]) { sp[i] = v; fq[i] = f; }
      }
      t += len + (Math.random() < 0.2 ? 0.1 + Math.random() * 0.14 : 0.008 + Math.random() * 0.04);
    }
    // 2) 合成：帶通濾波的柔和噪音（音色隨筆速變化）× 紙纖維顆粒 + 稀疏的細小摩擦「喀沙」
    let low = 0, band = 0, gs = Math.random(), gt = Math.random(), cr = 0, y = 0;
    const gstep = Math.floor(sr / 110), Q = 0.55;
    for (let i = 0; i < n; i++) {
      const v = sp[i];
      if (v < 0.002) { d[i] = 0; y *= 0.9; continue; }
      const fc = 380 + 1000 * v * fq[i], F = 2 * Math.sin(Math.PI * fc / sr);
      const w = Math.random() * 2 - 1;
      low += F * band; const high = w - low - Q * band; band += F * high;
      const k = i % gstep; if (k === 0) { gs = gt; gt = Math.random(); }
      const gr = 0.5 + 0.5 * (gs + (gt - gs) * (k / gstep));
      if (Math.random() < v * 0.010) cr = (Math.random() * 2 - 1);
      cr *= 0.82;
      const x = (band * 0.6 * gr + cr * 0.6) * v;
      y += 0.3 * (x - y); d[i] = y;
    }
    let pk = 0; for (let i = 0; i < n; i++) pk = Math.max(pk, Math.abs(d[i]));
    const m = pk ? 0.9 / pk : 1; for (let i = 0; i < n; i++) d[i] *= m;
    const fade = Math.floor(sr * 0.04);
    for (let i = 0; i < fade; i++) { const r = i / fade; d[i] *= r; d[n - 1 - i] *= r; }
    return buf;
  }

  function init() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ctx = new AC();
    loop = makeLoop();
  }

  function start() {
    if (!enabled || !ctx || !loop) return;
    if (ctx.state === 'suspended') ctx.resume();
    const t = ctx.currentTime, target = 0.85 * volume;
    if (!playing) {
      src = ctx.createBufferSource(); src.buffer = loop; src.loop = true;
      gain = ctx.createGain();
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.linearRampToValueAtTime(Math.max(target, 0.0002), t + 0.06);
      src.connect(gain); gain.connect(ctx.destination);
      src.start(0, Math.random() * (loop.duration - 0.8));
      playing = true;
    } else {
      gain.gain.cancelScheduledValues(t);
      gain.gain.setValueAtTime(Math.max(gain.gain.value, 0.0001), t);
      gain.gain.linearRampToValueAtTime(Math.max(target, 0.0002), t + 0.04);
    }
    clearTimeout(idle);
    idle = setTimeout(stop, IDLE_MS);
  }

  function stop() {
    clearTimeout(idle);
    if (!playing) return;
    playing = false;
    const g = gain, s = src, t = ctx.currentTime;
    src = null; gain = null;
    g.gain.cancelScheduledValues(t);
    g.gain.setValueAtTime(Math.max(g.gain.value, 0.0001), t);
    g.gain.linearRampToValueAtTime(0.0001, t + 0.18);
    try { s.stop(t + 0.2); } catch (e) {}
  }

  function attach(el) {
    if (!el) return;
    el.addEventListener('pointerdown', init);
    el.addEventListener('focus', init);
    el.addEventListener('input', start);
    el.addEventListener('blur', stop);
  }

  return {
    attach,
    unlock: init,
    play: start,
    stop,
    setEnabled(v) { enabled = !!v; if (enabled) init(); else stop(); },
    setVolume(v) { volume = Math.min(1, Math.max(0, Number(v) || 0)); },
    _loop: () => loop,
  };
})();

// pen-sound.js — Pearla 寫信沙沙聲（使用「使用者提供的影片原始音軌」，連續循環版）
// 音檔：public/assets/pearla-writing-sound-from-video.wav（相對路徑，GitHub Pages 子路徑也能讀到）
// 打字時整段音軌無縫循環播放、不會中斷；停止打字約 0.35 秒後淡出並停止，刪除文字不會觸發。
// 找不到音檔時自動退回合成沙沙聲（PenSynth）。
const PenSound = (() => {
  const SOUND_URL = 'assets/pearla-writing-sound-from-video.wav';
  const IDLE_MS = 350;      // 停止打字多久後停止播放
  const XFADE = 0.25;       // 首尾交叉淡化秒數，讓循環接縫聽不出來
  const BASE_GAIN = 0.7;
  let ctx = null, loop = null, loading = false, failed = false;
  let enabled = false, volume = 0.5;
  let src = null, gain = null, idle = null, playing = false;
  const lens = new WeakMap();

  // 把原音軌首尾做等功率交叉淡化，產生可無縫循環的 buffer
  function makeSeamless(b) {
    const sr = b.sampleRate, L = b.length;
    const xf = Math.min(Math.floor(sr * XFADE), Math.floor(L / 3));
    const out = ctx.createBuffer(b.numberOfChannels, L - xf, sr);
    for (let c = 0; c < b.numberOfChannels; c++) {
      const d = b.getChannelData(c), o = out.getChannelData(c);
      for (let i = 0; i < L - xf; i++) o[i] = d[i];
      for (let i = 0; i < xf; i++) {
        const r = i / xf, a = Math.sin(r * Math.PI / 2), z = Math.cos(r * Math.PI / 2);
        o[i] = d[i] * a + d[L - xf + i] * z;
      }
    }
    return out;
  }

  function load() {
    if (loop || loading || failed || !ctx) return;
    loading = true;
    fetch(SOUND_URL)
      .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.arrayBuffer(); })
      .then(ab => new Promise((ok, no) => ctx.decodeAudioData(ab, ok, no)))
      .then(b => { loop = makeSeamless(b); })
      .catch(() => { failed = true; })
      .then(() => { loading = false; });
  }

  function init(el) {
    if (el && el.value != null) lens.set(el, el.value.length);
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) { failed = true; return; }
      ctx = new AC();
    }
    if (ctx.state === 'suspended') ctx.resume();
    load();
  }

  function play(el, force) {
    if (!enabled && !force) return;
    if (el && el.value != null) {
      const n = el.value.length, prev = lens.has(el) ? lens.get(el) : n - 1;
      lens.set(el, n);
      if (n <= prev) return;            // 只在新增文字時續播
    }
    init();
    if (!loop) {                         // 音檔載入失敗 → 備援合成音；載入中 → 先靜音
      if (failed) { PenSynth.setVolume(volume); PenSynth.setEnabled(true); PenSynth.play(); }
      return;
    }
    const t = ctx.currentTime, target = Math.max(volume * BASE_GAIN, 0.0002);
    if (!playing) {
      src = ctx.createBufferSource(); src.buffer = loop; src.loop = true;
      gain = ctx.createGain();
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.linearRampToValueAtTime(target, t + 0.06);
      src.connect(gain); gain.connect(ctx.destination);
      src.start(0, Math.random() * loop.duration);
      playing = true;
    } else {
      gain.gain.cancelScheduledValues(t);
      gain.gain.setValueAtTime(Math.max(gain.gain.value, 0.0001), t);
      gain.gain.linearRampToValueAtTime(target, t + 0.04);
    }
    clearTimeout(idle);
    idle = setTimeout(stop, IDLE_MS);
  }

  function stop() {
    clearTimeout(idle);
    if (failed) PenSynth.stop();
    if (!playing) return;
    playing = false;
    const g = gain, s = src, t = ctx.currentTime;
    src = null; gain = null;
    g.gain.cancelScheduledValues(t);
    g.gain.setValueAtTime(Math.max(g.gain.value, 0.0001), t);
    g.gain.linearRampToValueAtTime(0.0001, t + 0.18);
    try { s.stop(t + 0.2); } catch (e) {}
  }

  function attach(el) {
    if (!el) return;
    el.addEventListener('pointerdown', () => init(el));
    el.addEventListener('focus', () => init(el));
    el.addEventListener('input', () => play(el));
    el.addEventListener('blur', stop);
  }

  return {
    attach,
    unlock: init,
    play,
    stop,
    setEnabled(v) { enabled = !!v; if (enabled) init(); else stop(); },
    setVolume(v) { volume = Math.min(1, Math.max(0, Number(v) || 0)); PenSynth.setVolume(volume); },
    preview() { init(); let k = 0; const tick = () => { if (k++ < 6) { play(null, true); setTimeout(tick, 150); } }; tick(); },
  };
})();

const CrabMail = (() => {

        wrap.remove();

        state = 'ready';
      }
    });
  }

  return { show };
})();

function cpUI(skipHex){if(!cpk||!$('#cpsv'))return;const hx=hsv2hex(cpk.h,cpk.s,cpk.v);cpk.hex=hx;$('#cpnew').style.background=hx;if(!skipHex)$('#cphex').value=hx;

function cpMove(e){const el=cpk&&cpk.drag&&$('#'+cpk.drag);if(!el)return;const r=el.getBoundingClientRect(),x=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)),y=Math.min(1,Math.max(0,(e.clientY-r.top)/r.height));if(cpk.drag==='cpsv'){cpk.s=x;cpk.v=1-y}else cpk.h=Math.min(359.9,x*360);cpUI()}

  document.addEventListener('scroll',e=>{const t=e.target;if(t.classList&&t.classList.contains('pager')){const n=Math.round(t.scrollLeft/t.clientWidth);document.querySelectorAll('.dots i').forEach((d,k)=>d.classList.toggle('on',k===n))}},true);
  document.addEventListener('focusin',e=>{if(e.target.id==='bt')$('#bph').style.display='none'});
  document.addEventListener('focusout',e=>{if(e.target.id==='bt'&&!e.target.value)$('#bph').style.display=''});
  document.addEventListener('input',e=>{const t=e.target;
    if(t.id==='gname'){const g=grp(gEditId);if(g)g.name=t.value;return}if(t.id==='abn'){t.value=t.value.replace(/\D/g,'').slice(0,16);abN=t.value;return}if(t.id==='abq'){abQ=t.value;return}if(t.id==='mh1'||t.id==='mh2'){t.value=t.value.replace(/\D/g,'').slice(0,16);if(t.id==='mh1')mhN1=t.value;else mhN2=t.value;return}if(t.id==='mht'){mhT=t.value;return}if(t.id==='mhq'){mhQ=t.value;return}if(t.id==='cq'){cq=t.value;if(delMode&&selC.length){const ok=new Set(cardSelIds()),n=selC.filter(x=>ok.has(x));if(n.length!==selC.length){selC=n;render();const f=$('#cq');if(f){f.focus();try{f.setSelectionRange(f.value.length,f.value.length)}catch(er){}}return}}const r=$('#cres'),m=$('#cmain'),on=cq.trim();r.innerHTML=on?cres():'';r.style.display=on?'':'none';m.style.display=on?'none':''}
