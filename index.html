.ec img{width:100%;height:100%;max-height:none;object-fit:cover;display:block;border-radius:0;cursor:pointer}
.ec .ib{position:absolute;top:3px;right:3px;width:22px;height:22px;font-size:11px;background:var(--bg)}
.ec.off{opacity:.4}.emoji-edit-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:8px 0}.emoji-edit{min-width:0;min-height:54px;padding:6px 8px;border:1.2px dashed var(--line);border-radius:11px;background:var(--card);display:flex;align-items:center;justify-content:space-between;gap:6px}.emoji-face{width:34px;height:34px;display:grid;place-items:center;font-size:25px;overflow:hidden;flex:none}.emoji-face img{width:100%;height:100%;object-fit:contain}.emoji-actions{display:flex;align-items:center;justify-content:flex-end;gap:6px;margin-top:0;flex:none}.emoji-actions .ib{width:25px;height:25px;display:grid;place-items:center;padding:0;line-height:1}.emoji-actions .sw{width:28px;height:16px;flex:none}.emoji-actions .sw::after{top:2px;left:2px;width:10px;height:10px}.emoji-actions .sw.on::after{left:14px}.emoji-edit.off{opacity:.42}
#f .ib,.chh .ib{width:38px;height:38px;flex:none;display:grid;place-items:center;padding:0}
.today-mood-panel{padding:4px 2px 18px}.today-mood-header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0}.today-mood-header h2{margin:0;font-size:16px;font-weight:500;color:var(--ink)}.today-mood-header .btn{width:auto;margin:0;padding:6px 13px}.today-mood-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.today-mood-card{min-width:0;padding:10px;border:1.2px dashed var(--line);border-radius:14px;background:var(--card)}.today-mood-card.off{opacity:.56}.today-mood-value{display:flex;align-items:center;gap:8px;min-width:0;min-height:30px}.today-mood-emoji{flex:none;font-size:23px;line-height:1}.today-mood-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;color:var(--ink)}.today-mood-actions{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:9px}.today-mood-actions .btn{width:auto;margin:0;padding:5px 9px;font-size:11px}.today-mood-add{width:100%;margin-top:10px}.mood-emoji-picker{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin:7px 0 12px}.mood-emoji-choice{width:100%;padding:6px 0;border:1.2px solid var(--line);border-radius:10px;background:var(--card);font-size:21px;line-height:1.2;cursor:pointer}.mood-emoji-choice.on{border-color:var(--lav);background:#eeeaff}.mood-desc-label{display:block;margin:4px 0;font-size:12px;color:var(--soft)}#daily-pop .daily-section+.daily-section{margin-top:9px}#daily-pop .daily-title{margin:0 0 4px;font-size:11px;font-weight:500;letter-spacing:.1em;color:var(--soft)}#daily-pop .daily-mood-row{display:flex;align-items:baseline;gap:8px;margin:0 0 9px}#daily-pop .daily-mood-row .daily-title{margin:0}#daily-pop .daily-mood-value{font-size:14px;line-height:1.45}#daily-pop .daily-copy{margin:3px 0 0;padding:0;border:0;background:transparent;border-radius:0;font-size:13px;line-height:1.55}</style>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const rnd=()=>crypto.getRandomValues(new Uint32Array(1))[0]/4294967296;
const ri=n=>Math.floor(rnd()*n);
const tm=t=>{const d=new Date(t);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const ini=n=>String(n||'').trim().slice(0,1)||'TA';
const WAITS=[3,10,30,60,300,900,1800,3600,7200];
const WL=s=>s<60?s+' 秒':s<3600?s/60+' 分鐘':s/3600+' 小時';
let S,db,tab='home',scope='s',kind='card',selCat=null,askCb=null,jump=null,emoScope='s',lastRenderedTab='';

/* ── IndexedDB ── */
const idb=()=>new Promise(r=>{try{const q=indexedDB.open('pearla',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>{db=q.result;r()};q.onerror=()=>r()}catch(e){r()}});
const load=()=>new Promise(r=>{if(!db)return r(null);try{const q=db.transaction('kv').objectStore('kv').get('s');q.onsuccess=()=>r(q.result||null);q.onerror=()=>r(null)}catch(e){r(null)}});
const save=()=>{try{db&&db.transaction('kv','readwrite').objectStore('kv').put(JSON.parse(JSON.stringify(S)),'s')}catch(e){}};

function def(){
  const a=uid(),b=uid(),c1=uid(),c2=uid(),c3=uid();
  return{me:'我',cur:a,contacts:[{id:a,name:'名字'}],msgs:{},
    cats:[{id:c1,sc:'s',name:'日常關心',on:1,as:[]},{id:c2,sc:'s',name:'撒嬌',on:1,as:[]},{id:c3,sc:'e',name:'專屬分類',on:1,as:[a]}],
    cards:[{id:uid(),cat:c1,text:'今天有好好吃飯嗎？',on:1},{id:uid(),cat:c1,text:'記得早點睡，別熬夜。',on:1},{id:uid(),cat:c1,text:'我在想你。',on:1},{id:uid(),cat:c2,text:'再多陪我一下下嘛。',on:1},{id:uid(),cat:c3,text:'只有你能讓我這樣。',on:1}],
    set:{wi:2,star:10,dailyMoodOn:1,starColor:'#5f5b8d',mood:50,heart:50,intent:50,pat:50,emoji:50,dailyOn:0,dailyProb:70,dailyWindow:21600,dailyMin:1,dailyMax:5,dailyKao:20,dailyEmoji:20,statusOn:0,statusWindow:7200,statusProb:70},
    tags:{mood:['心動','想念','害羞','安心'],heart:['很喜歡你','想見你','想被抱一下'],intent:['想聊天','想撒嬌','想分享今天']},
    pend:[],daily:{day:'',base:0,next:0,done:false,items:[]},locked:true};
}
const cur=()=>S.contacts.find(c=>c.id===S.cur)||S.contacts[0];
const ms=id=>S.msgs[id]||(S.msgs[id]=[]);
const kc=c=>c.kind||'card';
const KINDS=[['card','字卡'],['mood','情緒'],['heart','心意'],['intent','交流意圖'],['emoji','表情包'],['pat','拍一拍']];

const RULES='<div style="font-size:14px;line-height:1.9"><p style="margin:0 0 8px"><b>Pearla 的隨機系統遵守以下規則：</b></p><p>① 每次字卡抽取都獨立進行。</p><p>② 所有符合條件的字卡，被抽中的機會完全相同。</p><p>③ 不排除重複結果，同一張字卡可以連續被抽到。</p><p>④ 不因連續抽到相同結果而調整機率。</p><p>⑤ 不設置保底或補償機制。</p><p>⑥ 不刻意平均分配結果。</p><p>⑦ 每一種互動的機率各自獨立判定。</p><p>⑧ 每項設定的數值只影響它所對應的那項互動。</p><p>⑨ 不根據你輸入的文字做語意分析。</p><p>⑩ 不根據之前的互動結果改變後續機率。</p><p>⑪ 被動回覆在發送訊息後先等 3 秒，3 秒過後才開始判定是否已讀不回；主動發送則先到達主動發送判定點，再判定發送取消概率，未取消才隨機計算下一個發送時間。</p><p>⑫ 等待回覆期間不會預先選字卡，等待時間結束後才抽取並立即傳送；一旦抽出就一定會傳送，不會再做第二次「要不要傳」的判定。</p><p>⑬ 同一次回覆有多條時，所有字卡在同一時間抽好，但每隔 3 秒（暫定）才發送下一條。</p><p>⑭ 每條字卡的引用、情緒、心意等判定各算各的，不受同一輪其他字卡影響。</p><p>⑮ emoji和顏文字的抽取判定是：每次回覆、主動發送都會依照設定機率，隨機抽取是否添加emoji與顏文字；抽中則會隨機出現在當次回覆的開頭或結尾，開頭與結尾的概率各一半。</p><p>⑯ 各類提醒、他的問題、他的吐槽都是額外發送的訊息，不佔用主動發送的字卡概率與次數。</p><p>⑰ 每日留言會在每日 0 點開始抽取；若抽取失敗，會在設定的抽取時間結束後再次抽取。若當時未開啟網頁，則於開啟網頁後立刻開始抽取；同一天重複開啟網頁不會重置或重新判定，必須等到已儲存的抽取時間結束。每天 0 點會重新建立當天的抽取時間段，不沿用前一天的時間段；抽取成功後，當天不再繼續抽取。</p><p>⑱ 狀態會在程式開啟後開始計時，每到設定的抽取時間才判定一次是否更改狀態；重複開啟程式不會重置計時，必須等到設定時間結束後才會再次判定。若判定成功，會從狀態字卡中隨機抽取並顯示在聊天室名稱下方。</p><p>⑲ 所有計時以目前選定的聊天對象為單位，每個對象各自保存下一次狀態判定時間。</p></div>';
const NOVA='<div style="font-size:14px;line-height:1.9"><p style="margin:0 0 10px"><b>Nova 式回覆</b>是「連著說的話併成一輪再回」的回覆方式，讓對方看起來像真的在讀你的話、想一想再回。</p><p>① 一輪只排一次隊：你連著發的幾句話併成同一輪，每位聯絡人各自只排一次隊。</p><p>② 骰子只擲一次：已讀不回、拍一拍、回幾條，在這一輪開始時擲定，之後補的句子不會重擲；引用則是每一條各擲各的。</p><p>③ 到點時間：發送後先等 3 秒，沒有已讀不回，才從「回覆最短時間」到「回覆最長時間」之間隨機抽一個等待時間。</p><p>④ 補一句往後推：你每多補一句，到點時間往後推 1.5 秒，一輪最多替你多等 8 秒。</p><p>⑤ 各排各的：每位聯絡人各有自己的一輪，切去別的聯絡人發訊息，不會頂掉原本那一輪的計時。</p><p>⑥ 已讀不回：發送 3 秒後才開始判定；若擲到，小字當下就出現、這一輪不再回覆；沒擲到才開始抽等待時間與字卡。</p><p>⑦ 回覆內容：每一條依表情包、emoji、顏文字的概率決定型態，都沒中就從字卡抽取；每次抽取獨立、機會均等。</p></div>';

    return B('被動回覆','','回覆')+B('主動發送','a','發送')+C('<h3>點擊頭像發送消息</h3>'+N('avatarSend','點擊後發送消息時間','秒')+'<p class="hint">點擊頭像發送消息除了時間設置，其他設置皆與主動發送設置一致。</p>')+C('<h3>標籤設置</h3>'+N('mood','情緒出現概率','%')+N('heart','心意出現概率','%')+N('intent','交流意圖出現概率','%'))+C('<h3>標記</h3><div class="sr"><span>重要訊息標記圖形</span></div><div class="mkp">'+Object.keys(MK).map(k=>`<button class="mkb ${(S.set.mk||'star')===k?'on':''}" data-a="mk" data-i="${k}">${MK[k]}<small>${MKN[k]}</small></button>`).join('')+'</div><div class="sr" style="align-items:center"><span>重要訊息標記顏色</span><span class="color-field"><input type="color" class="color-input" id="markColor" value="'+(S.set.starColor||S.ink||'#5f5b8d')+'"><button class="btn color-reset" data-a="markColorReset">還原</button></span></div>'+N('star','重要訊息標記概率','%'))+C('<h3>提醒設置</h3>'+N('rwater','喝水提醒概率','%')+N('rmeal','吃飯提醒概率','%')+N('rsport','運動提醒概率','%'))+'<p class="hint">概率皆為 0% 到 100%。標題旁的 ? 有說明。</p>'}

  if(id==='daily'){const D3=(k,l)=>{const t=Math.round(S.set[k]||0),a=[Math.floor(t/3600),Math.floor(t%3600/60),t%60],I=(q,v)=>`<input type="number" inputmode="numeric" data-t3="${k}" data-p="${q}" value="${v}" style="width:54px;text-align:right;padding:6px 8px">`;return `<div class="sr" style="align-items:center"><span>${l}</span><span>${I('h',a[0])} 時 ${I('m',a[1])} 分 ${I('s',a[2])} 秒</span></div>`};return C('<h3>每日留言</h3><div class="sr" style="align-items:center"><span>每日留言開關</span><button class="sw '+(S.set.dailyOn?'on':'')+'" data-a="sw" data-i="dailyOn"></button></div>'+N('dailyProb','是否留言抽取機率','%')+D3('dailyWindow','抽取時間')+N('dailyMin','留言內容字卡數量最少','條')+N('dailyMax','留言內容字卡數量最多','條')+N('dailyKao','顏文字機率','%')+N('dailyEmoji','emoji機率','%'))+C('<h3>今日心情</h3><div class="sr" style="align-items:center"><span>今日心情開關</span><button class="sw '+(S.set.dailyMoodOn?'on':'')+'" data-a="sw" data-i="dailyMoodOn"></button></div><p class="hint" style="margin-top:8px">當每日留言成功抽取字卡才會一起抽取今日心情</p>')}

  document.addEventListener('scroll',e=>{const t=e.target;if(t.classList&&t.classList.contains('pager')){const n=Math.round(t.scrollLeft/t.clientWidth);document.querySelectorAll('.dots i').forEach((d,k)=>d.classList.toggle('on',k===n))}},true);
  document.addEventListener('focusin',e=>{if(e.target.id==='bt')$('#bph').style.display='none'});
  document.addEventListener('focusout',e=>{if(e.target.id==='bt'&&!e.target.value)$('#bph').style.display=''});
  document.addEventListener('input',e=>{const t=e.target;
    if(t.id==='cq'){cq=t.value;const r=$('#cres'),m=$('#cmain'),on=cq.trim();r.innerHTML=on?cres():'';r.style.display=on?'':'none';m.style.display=on?'none':''}
    if(t.dataset&&t.dataset.t3){const k=t.dataset.t3,v=[...t.closest('.sr').querySelectorAll('[data-t3]')].map(x=>Math.max(0,parseInt(x.value)||0));S.set[k]=v[0]*3600+v[1]*60+v[2];saveSoon()}});
  document.addEventListener('change',e=>{const t=e.target;if(t.dataset&&t.dataset.t3){const k=t.dataset.t3,T=Math.round(S.set[k]||0),a=[Math.floor(T/3600),Math.floor(T%3600/60),T%60];t.closest('.sr').querySelectorAll('[data-t3]').forEach((x,i)=>x.value=a[i]);save()}});
  ['gesturestart','gesturechange'].forEach(g=>document.addEventListener(g,e=>e.preventDefault()));
  document.addEventListener('touchmove',e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});
  S.pend=S.pend||[];
  statusTick();
  dailyTick();
  save();render();
})();
</script>
</body>
</html>
