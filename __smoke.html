<!doctype html><meta charset="utf-8"><pre id="result">RUNNING</pre><iframe id="app" src="/index.html" style="width:390px;height:844px;border:0"></iframe><script>
(async()=>{const f=document.getElementById('app'),out=document.getElementById('result'),errs=[];window.addEventListener('error',e=>errs.push('parent error '+e.message));await new Promise(r=>f.onload=r);try{f.contentWindow.addEventListener('error',e=>errs.push('child error '+e.message));f.contentWindow.addEventListener('unhandledrejection',e=>errs.push('child rejection '+e.reason));await new Promise(r=>setTimeout(r,5000));const d=f.contentDocument;out.textContent='URL='+d.location.href+'\nTITLE='+d.title+'\nBODYTEXT='+d.body.innerText.slice(0,1500)+'\nVHTML='+((d.querySelector('#v')||{}).innerHTML||'').slice(0,2200)+'\nERRORS='+errs.join(' | ')+'\n';}catch(e){out.textContent='ERROR '+e.stack}}
)();</script>
